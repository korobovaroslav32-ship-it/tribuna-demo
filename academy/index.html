/* Макет: тёмная боковая колонка с карточкой профиля слева, рабочая область справа.
   Золотой градиент только на главных действиях, остальное графит и тонкие границы. */
:root{
  --bg:#08090B; --bg2:#0B0C0F; --surface:#101215; --surface-hi:#15181C; --surface2:#171A1F;
  --line:rgba(255,255,255,.08); --line2:rgba(255,255,255,.055); --input-line:rgba(255,255,255,.16);
  --fg:#F3F3F0; --muted:#8B9099; --muted2:#A4A9B1;
  --gold:#E8C27A; --gold-grad:linear-gradient(135deg,#F6DFA9 0%,#E3AA66 100%); --gold-ink:#1A1306;
  --gold-soft:rgba(232,194,122,.12); --gold-line:rgba(232,194,122,.38);
  --accent:#E8C27A; --accent-fg:#1A1306; --accent-soft:rgba(232,194,122,.12); --accent-ink:#E8C27A;
  --ok:#43D6A0; --ok-bg:rgba(67,214,160,.13); --ok-fg:#5BE3B1;
  --no:#F0716A; --bad-bg:rgba(240,113,106,.14); --bad-fg:#FF9E98;
  --ex:#E8B04A; --warn-bg:rgba(232,176,74,.14); --warn-fg:#F2C56E;
  --info-bg:rgba(86,182,240,.14); --info-fg:#86C9F6;
  --mk-fg:#07130E; --note-bg:rgba(232,176,74,.07); --note-line:rgba(232,176,74,.3);
  --track:rgba(255,255,255,.09); --btn-dark:#F3F3F0; --btn-dark-fg:#08090B;
  --font:'Manrope Variable','Manrope',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:500 15px/1.5 var(--font);-webkit-text-size-adjust:100%}
::selection{background:var(--gold);color:var(--gold-ink)}
h1,h2,h3,p{margin:0}
a{color:inherit;text-decoration:none}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
.num{font-variant-numeric:tabular-nums}

.app{display:grid;grid-template-columns:268px minmax(0,1fr);min-height:100%}
.side{background:var(--bg2);border-right:1px solid var(--line);padding:26px 16px 20px;display:flex;flex-direction:column;gap:26px;min-width:0}
.brand{display:flex;align-items:center;gap:12px;padding:0 6px}
.logo{width:42px;height:42px;flex:none;border-radius:50%;background:var(--gold-grad);display:flex;align-items:center;justify-content:center;color:var(--gold-ink)}
.brand b{display:block;font-weight:800;font-size:17px;letter-spacing:.07em;color:#fff;line-height:1.1}
.brand span{display:block;font-size:10px;font-weight:700;letter-spacing:.24em;color:var(--muted);text-transform:uppercase;margin-top:3px}
.nav{display:flex;flex-direction:column;gap:4px}
.nav a{display:flex;align-items:center;gap:14px;min-height:46px;padding:0 16px;border-radius:14px;color:var(--muted2);font-weight:600;white-space:nowrap}
.nav a:hover{background:rgba(255,255,255,.04);color:#fff}
.nav a[aria-current="page"]{background:rgba(255,255,255,.08);color:#fff}
.ic{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}

.row{display:flex;flex-wrap:wrap;align-items:center;gap:12px}

.tile{background:linear-gradient(180deg,rgba(255,255,255,.035),rgba(255,255,255,.012)),var(--surface);border:1px solid var(--line);border-radius:20px;padding:20px 22px;display:flex;flex-direction:column;gap:8px;min-width:0}

.dt{width:52px;flex:none;text-align:center;background:rgba(255,255,255,.05);border-radius:14px;padding:6px 0}

.btn{min-height:44px;padding:0 22px;border-radius:999px;border:1px solid var(--input-line);background:transparent;color:var(--fg);font-weight:700;font-size:14px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-align:center}

.pill.bad{background:var(--bad-bg);color:var(--bad-fg)}.pill.info{background:var(--info-bg);color:var(--info-fg)}
.pill.mute{background:rgba(255,255,255,.07);color:var(--muted2)}.pill.solid{background:var(--gold-grad);color:var(--gold-ink)}
.bar{height:8px;border-radius:999px;background:var(--track);overflow:hidden}.bar i{display:block;height:100%;border-radius:999px;background:var(--gold-grad)}
.field label,.lab{display:block;font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:8px}
.inp{width:100%;min-height:46px;padding:0 16px;border:1px solid var(--input-line);border-radius:14px;background:#0B0C0F;font-weight:600}

.pn{width:28px;flex:none;font-size:13px;font-weight:700;color:var(--muted)}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.cal .wd{text-align:center;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.cal .c{min-height:48px;border-radius:12px;border:0;background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;font-weight:600;font-size:14px;color:var(--fg)}
.cal button.c{cursor:pointer}.cal button.c:hover{background:rgba(255,255,255,.06)}
.cal .c.today{background:var(--gold-soft);font-weight:800;color:var(--gold)}.cal .c.sel{outline:2px solid var(--gold)}
.cal i{width:8px;height:8px;border-radius:50%;border:2px solid var(--gold);display:block}.cal i.done{background:var(--gold)}.cal i.miss{border-color:var(--no);background:var(--no)}.cal i.rep{border-color:var(--ex);background:var(--ex)}
.cal .nd{height:8px}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}.legend i{width:8px;height:8px;border-radius:50%;border:2px solid var(--gold);display:inline-block}.legend i.done{background:var(--gold)}.legend i.miss{border-color:var(--no);background:var(--no)}.legend i.rep{border-color:var(--ex);background:var(--ex)}
.note{background:var(--note-bg);border:1px solid var(--note-line);border-radius:20px;padding:18px 24px}
.cols3{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr));align-items:start}
.lane{background:rgba(255,255,255,.025);border:1px solid var(--line);border-radius:20px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.lane .card{padding:18px;border-radius:16px;display:flex;flex-direction:column;gap:10px;background:var(--surface-hi)}
.mat{padding:0;overflow:hidden;display:flex;flex-direction:column}

.mat .body{padding:20px;display:flex;flex-direction:column;gap:10px;flex:1}
.t-video{background:var(--info-bg);color:var(--info-fg)}.t-guide{background:var(--gold-soft);color:var(--gold)}.t-plan{background:var(--warn-bg);color:var(--warn-fg)}.t-reg{background:rgba(255,255,255,.05);color:var(--muted2)}.t-data{background:var(--ok-bg);color:var(--ok-fg)}
.tag{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase}
.tl{display:flex;gap:14px;padding-bottom:16px}.tl .m{display:flex;flex-direction:column;align-items:center;flex:none}
.tl .m i{width:10px;height:10px;border-radius:50%;background:var(--gold);margin-top:5px}.tl .m i.hol{background:transparent;border:2px solid var(--gold)}
.tl .m s{flex:1;width:2px;background:var(--line);margin-top:4px}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--btn-dark);color:var(--btn-dark-fg);padding:12px 22px;border-radius:999px;font-weight:700;font-size:14px;max-width:calc(100% - 32px);z-index:50;box-shadow:0 10px 30px rgba(0,0,0,.5)}
.empty{padding:28px 12px;text-align:center;color:var(--muted)}

/* главная: приветствие, быстрые действия, полосы, графики */
.hero{position:relative;overflow:hidden;border-radius:24px;border:1px solid var(--line);padding:34px 38px;min-height:220px;display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:24px;background:radial-gradient(60% 130% at 88% 0%,rgba(232,194,122,.16),transparent 62%),linear-gradient(180deg,#15171B,#0C0D10)}

.hero .pitch{position:absolute;right:-30px;top:0;height:100%;width:min(64%,680px);pointer-events:none;-webkit-mask-image:linear-gradient(to left,#000 35%,transparent);mask-image:linear-gradient(to left,#000 35%,transparent)}
.hero>*{position:relative}
.hero .who{display:flex;align-items:center;gap:12px;margin-bottom:18px}
.hero .who .ava{width:40px;height:40px}
.hero h1{font-size:clamp(32px,4.6vw,56px);line-height:1.04;margin:0}
.g{background:var(--gold-grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{color:var(--muted2);max-width:54ch;margin-top:14px;font-size:15px}
.qa{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr))}
.qa a{display:flex;align-items:center;gap:14px;padding:16px 20px;border-radius:20px;border:1px solid var(--line);background:linear-gradient(180deg,rgba(255,255,255,.035),rgba(255,255,255,.012)),var(--surface);min-width:0}

.qa .ib{width:44px;height:44px;flex:none;border-radius:50%;background:rgba(255,255,255,.06);color:var(--gold);display:flex;align-items:center;justify-content:center}
.qa b{display:block;font-size:15px;font-weight:700;line-height:1.25}.qa span{display:block;font-size:12px;color:var(--muted);margin-top:2px}
.strip{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:16px 24px;border-radius:20px;border:1px solid var(--line);padding:22px 26px;background:linear-gradient(180deg,rgba(255,255,255,.035),rgba(255,255,255,.012)),var(--surface)}
.strip .l{display:flex;align-items:center;gap:18px;min-width:0;flex:1 1 360px}

.gold{color:var(--gold)}
.ch{display:grid;grid-template-columns:42px minmax(0,1fr);gap:0 10px;height:220px;margin-top:22px}
.ch .ya{display:flex;flex-direction:column;justify-content:space-between;font-size:12px;color:var(--muted);text-align:right;margin:-8px 0}
.ch .plot{position:relative;border-left:0}
.ch .gl{position:absolute;left:0;right:0;height:1px;background:var(--line)}
.ch svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.ch .pt{position:absolute;width:12px;height:12px;margin:-6px 0 0 -6px;border-radius:50%;background:var(--gold);box-shadow:0 0 0 5px rgba(232,194,122,.2)}
.xl{position:relative;height:22px;margin:8px 0 0 52px;font-size:12px;color:var(--muted)}

.donut svg{width:176px;height:176px;max-width:100%}
.donut .c{position:absolute;text-align:center}
.donut .c b{display:block;font-size:30px;font-weight:700;line-height:1}.donut .c span{font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.lg{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line2);font-size:14px}
.lg i{width:9px;height:9px;border-radius:50%;flex:none}

@media (max-width:1000px){.cols{grid-template-columns:minmax(0,1fr)}}
@media (max-width:860px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{padding:16px;gap:14px;border-right:0;border-bottom:1px solid var(--line)}
  .nav{flex-direction:row;overflow-x:auto;padding-bottom:2px}

  .card{padding:20px}
  .hero{padding:24px 22px;min-height:0}
  .hero .pitch{opacity:.5;width:100%}
  .strip{padding:18px 20px}
}
@media (prefers-reduced-motion:no-preference){.btn,.fchip,.nav a,.qa a,.mk button{transition:background-color .15s,border-color .15s,color .15s}}

function seed(){

    const total=MODS[s.cat].length,k=Math.min(total,(i*5)%7);

      else if(st==='submitted'){o.due=addDays(t,-2);o.submittedAt=addDays(t,-2);o.text=TXT[(i+j)%3]}
      else if(st==='review'){o.due=addDays(t,-4);o.submittedAt=addDays(t,-4);o.reviewerId=s.curatorId;o.text=TXT[(i+j)%3]}
      else if(st==='wait'){o.due=addDays(t,4+j*2)}
      else{o.due=addDays(t,-3)}
      works.push(o);
    });
    const ms=['m1','m2','m3','m4'];

  });
  users.filter(u=>u.role==='curator').forEach((c,i)=>{
    works.push({id:'w'+(++n),owner:c.id,title:'Ежемесячный отчёт куратора за сентябрь',kind:'Отчёт куратора',status:'checked',due:addDays(t,-14),submittedAt:addDays(t,-15),checkedAt:addDays(t,-12),grade:9,reviewerId:'m1',text:'Группа из шести студентов: все сдали обязательные работы, двое отстают по программе. Провёл две консультации и один разбор видео.',comments:[{id:uid(),by:'m1',at:addDays(t,-12),text:'Отчёт полный, спасибо. Добавьте в следующем месяце динамику оценок по студентам.'}]});
    const st=['submitted','wait','review'][i];
    works.push({id:'w'+(++n),owner:c.id,title:'Отчёт по группе за октябрь',kind:'Отчёт куратора',status:st,due:st==='wait'?addDays(t,10):addDays(t,-1),submittedAt:st==='wait'?null:addDays(t,-1),reviewerId:st==='review'?'m1':null,text:st==='wait'?'':'Промежуточный отчёт: работы проверяются в срок, средняя оценка по группе растёт.',comments:[]});
  });
  const mats=[
    {id:'m1',type:'reg',cats:['C','B','A'],title:'Структура тренерского образования АБФФ',meta:'Схема, 1 страница',date:addDays(t,-9),mandatory:true,text:'Ступени образования: С-УЕФА (обучение 4 месяца), В-УЕФА (7 месяцев), А-УЕФА (12 месяцев), PRO-УЕФА (от 18 месяцев). Между ступенями нужна практика: 6 месяцев работы после С, по 12 месяцев после В и А. После С-УЕФА выдаётся сертификат «Лидер массового футбола». Отдельные ветки: В-УЕФА в футзале, для тренеров вратарей (В и А) и для тренеров по физической подготовке.'},
    {id:'m2',type:'guide',cats:['C'],title:'Построение занятия для детей 8–10 лет',meta:'PDF, 14 страниц',date:addDays(t,-8),mandatory:true,text:'Структура занятия: подготовительная, основная и заключительная части. Игровые формы вместо длинных объяснений, не больше двух минут на инструкцию, максимум касаний мяча.'},

    {id:'m8',type:'reg',cats:['C','B','A'],title:'Правила сдачи работ и оценивания',meta:'PDF, 4 страницы',date:addDays(t,-20),mandatory:true,text:'Статусы работ: в ожидании, не сдано, сдано, на проверке, проверено. Оценка по десятибалльной шкале. Куратор проверяет работы своих студентов, руководитель может проверить любую работу и оставить комментарий.'},

    {id:'m10',type:'data',cats:['A'],title:'Открытые данные StatsBomb',meta:'GitHub · JSON',date:addDays(t,-2),mandatory:false,url:'https://github.com/statsbomb/open-data',text:'Бесплатные данные StatsBomb: соревнования, матчи, события и составы. Описание формата лежит в папке doc. При публикации анализа нужно указывать StatsBomb как источник данных. Материалы на английском.'}
  ];

let state=null;
try{const raw=localStorage.getItem(KEY);if(raw)state=JSON.parse(raw)}catch(e){}
if(!state||!state.users)state=seed();
const ui={route:'home',f:{},auth:{step:'role',role:'student',mode:'login',err:'',code:'',pending:null},st:{cat:'all',cur:'all',q:'',tab:'students'},rep:{status:'all',sel:null,tab:'a',stu:'all',grade:0},mat:{type:'all',cat:'all',q:'',open:null,add:false},assign:false,resetAsk:false,save:'browser',cats:{}};
let saveT=null;
function save(){clearTimeout(saveT);saveT=setTimeout(()=>{try{localStorage.setItem(KEY,JSON.stringify(state));ui.save='browser'}catch(e){ui.save='local'}const el=document.getElementById('savebar');if(el)el.innerHTML=saveHtml()},250)}
function commit(fn){fn(state);save();render()}
const byId=id=>state.users.find(u=>u.id===id);
const me=()=>state.session?byId(state.session):null;
const workById=id=>state.works.find(w=>w.id===id);
function tick(){const t=todayDS();state.works.forEach(w=>{if(w.status==='wait'&&w.due<t)w.status='notsub'})}
tick();

/* ---------- права доступа ---------- */
const studentsOf=u=>u.role==='manager'?state.users.filter(x=>x.role==='student'):u.role==='curator'?state.users.filter(x=>x.role==='student'&&x.curatorId===u.id):[];
const canSee=(u,s)=>u.role==='manager'||(u.role==='curator'&&s.curatorId===u.id)||u.id===s.id;
function worksFor(u){
  if(u.role==='manager')return state.works.slice();
  if(u.role==='curator'){const ids=studentsOf(u).map(x=>x.id);return state.works.filter(w=>w.owner===u.id||ids.indexOf(w.owner)>-1)}
  return state.works.filter(w=>w.owner===u.id);
}
function canReview(u,w){
  const o=byId(w.owner);if(!o||w.owner===u.id)return false;
  return u.role==='manager'||(u.role==='curator'&&o.role==='student'&&o.curatorId===u.id);

function demoUser(r){return state.users.find(u=>u.role===r)}
function sendCode(){
  const a=ui.auth,F=ui.f,email=(F.email||'').trim().toLowerCase();
  a.err='';
  if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)){a.err='Введите корректный адрес электронной почты.';return}
  if(a.mode==='reg'){
    const name=(F.name||'').trim();
    if(name.split(/\s+/).length<2){a.err='Укажите имя и фамилию.';return}
    if(state.users.some(u=>u.email===email)){a.err='Эта почта уже зарегистрирована. Выберите «Вход».';return}
    a.pending={mode:'reg',email,name};
    if(a.role==='student'){a.pending.cat=F.cat||'C';a.pending.curatorId=F.cur||state.users.find(u=>u.role==='curator').id}
  }else{
    const u=state.users.find(x=>x.email===email);
    if(!u){a.err='Аккаунт с такой почтой не найден. Зарегистрируйтесь или подставьте демо-аккаунт.';return}
    if(u.role!==a.role){a.err='Эта почта зарегистрирована как «'+ROLE[u.role].toLowerCase()+'». Вернитесь назад и выберите нужную роль.';return}
    a.pending={mode:'login',email,userId:u.id};
  }
  a.code=String(Math.floor(100000+Math.random()*900000));
  a.step='code';ui.f.code='';
}
function verify(){
  const a=ui.auth,c=(ui.f.code||'').replace(/\s/g,'');
  if(c!==a.code){a.err='Неверный код. Проверьте письмо и попробуйте ещё раз.';return false}
  let uid_=a.pending.userId;
  if(a.pending.mode==='reg'){
    const p=a.pending,u={id:'u'+uid(),role:a.role,name:p.name,email:p.email,since:todayDS()};
    if(a.role==='student'){u.cat=p.cat;u.curatorId=p.curatorId;state.prog[u.id]=[];state.read[u.id]={}}
    state.users.push(u);uid_=u.id;
  }
  state.session=uid_;
  ui.auth={step:'role',role:'student',mode:'login',err:'',code:'',pending:null};ui.f={};
  ui.rep={status:'all',sel:null,tab:'a',stu:'all',grade:0};
  save();
  location.hash='home';ui.route='home';
  return true;
}

    ws=ws.filter(w=>{const o=byId(w.owner);return R.tab==='a'?o.role==='student':(u.role==='curator'?w.owner===u.id:o.role==='curator')});

  }
  return ws;
}

      '<div class="row" style="margin-top:14px"><button type="button" class="btn primary" data-act="checkwork" data-id="'+w.id+'">Проверено '+ic('check')+'</button><button type="button" class="btn" data-act="returnwork" data-id="'+w.id+'">Вернуть на доработку</button></div><p class="xs muted" style="margin-top:10px">Комментарий пишется ниже. Для возврата комментарий обязателен.</p></div>';}
  }
  const cm=canComment(u,w)?'<div class="field" style="margin-top:14px"><label for="f-wc">Комментарий</label><textarea class="inp" id="f-wc" data-f="wc" rows="3" placeholder="Что хорошо, что исправить">'+esc(ui.f.wc||'')+'</textarea></div><button type="button" class="btn sm" style="margin-top:10px" data-act="addwc" data-id="'+w.id+'">Добавить комментарий '+ic('comment')+'</button>':(u.role==='student'?'<p class="xs muted" style="margin-top:12px">Комментарии оставляют куратор и руководитель.</p>':'');
  return '<section class="card"><div class="row between" style="align-items:flex-start"><div><div class="eyebrow">'+esc(w.kind)+'</div><h2 style="margin-top:6px">'+esc(w.title)+'</h2></div>'+pill(w.status)+'</div>'+
    '<div class="meta"><div><span>Исполнитель</span>'+(o.role==='student'&&u.role!=='student'?'<a class="tlink" href="#student/'+o.id+'" style="min-height:24px">'+esc(o.name)+'</a>':'<b>'+esc(o.name)+'</b>')+'</div><div><span>Срок</span><b>'+dmy(w.due)+'</b></div><div><span>Сдано</span><b>'+(w.submittedAt?dm(w.submittedAt):'—')+'</b></div><div><span>Проверяет</span><b>'+(rev?esc(rev.name):(o.role==='student'?esc(byId(o.curatorId).name):'Руководитель'))+'</b></div>'+(w.grade?'<div><span>Оценка</span><b class="gold num">'+w.grade+' / 10</b></div>':'')+'</div>'+
    body+rv+'<h3 style="margin:22px 0 10px">Комментарии</h3>'+threadHtml(w.comments,'Комментариев пока нет.')+cm+'</section>';
}

/* ---------- Материалы ---------- */
function viewMaterials(u){
  const M=ui.mat,staff=u.role!=='student',rd=readOf(u);
  const list=state.mats.filter(m=>(M.type==='all'||m.type===M.type)&&(M.cat==='all'||m.cats.indexOf(M.cat)>-1)&&(!M.q||m.title.toLowerCase().indexOf(M.q.toLowerCase())>-1)&&(u.role!=='student'||m.cats.indexOf(u.cat)>-1||M.cat!=='all')).sort((a,b)=>a.date<b.date?1:-1);
  const chip=(k,v,l)=>'<button type="button" class="fchip" data-act="matfilter" data-k="'+k+'" data-v="'+v+'" aria-pressed="'+(M[k]===v)+'">'+l+'</button>';
  const cards=list.map(m=>{const open=M.open===m.id,isRead=!!rd[m.id];
    return '<article class="card mat"><div class="top t-'+m.type+'">'+ic(m.type)+'</div><div class="body"><div class="row" style="gap:6px"><span class="tag" style="color:var(--gold)">'+TYPES[m.type]+'</span>'+(m.mandatory?'<span class="pill mute">Обязательно</span>':'')+(m.src||m.url?'<span class="pill info">GitHub</span>':'')+'</div><h2 style="font-size:18px">'+esc(m.title)+'</h2><div class="small muted">'+esc(m.meta)+' · '+m.cats.map(c=>CATS[c].name).join(', ')+' · '+dm(m.date)+'</div>'+
      (open?'<p class="small" style="color:var(--muted2)">'+esc(m.text)+'</p>'+(m.url?'<a class="tlink" href="'+esc(m.url)+'" target="_blank" rel="noopener noreferrer">Открыть на GitHub '+ic('arr')+'</a>':''):'')+
      '<div class="row" style="margin-top:auto;gap:8px"><button type="button" class="btn sm" data-act="togmat" data-id="'+m.id+'" aria-expanded="'+open+'">'+(open?'Свернуть':'Читать')+'</button>'+(u.role==='student'?'<button type="button" class="btn sm'+(isRead?'':' primary')+'" data-act="readmat" data-id="'+m.id+'">'+(isRead?'Изучено ✓':'Отметить изученным')+'</button>':'')+'</div></div></article>'}).join('');
  const addF=staff&&M.add?'<section class="card stack" style="gap:14px"><h2>Новый материал</h2><div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr))"><div class="field"><label for="f-mt">Название</label><input class="inp" id="f-mt" data-f="mTitle" value="'+esc(ui.f.mTitle||'')+'"></div><div class="field"><label for="f-mtype">Тип</label><select class="inp" id="f-mtype" data-f="mType">'+Object.keys(TYPES).map(k=>'<option value="'+k+'"'+(ui.f.mType===k?' selected':'')+'>'+TYPES[k]+'</option>').join('')+'</select></div></div>'+
    '<fieldset><legend>Для каких категорий</legend><div class="opts">'+Object.keys(CATS).map(c=>'<button type="button" class="fchip" data-act="mcat" data-v="'+c+'" aria-pressed="'+((ui.cats[c]!==false))+'">'+CATS[c].name+'</button>').join('')+'</div></fieldset>'+
    '<div class="field"><label for="f-mtext">Описание</label><textarea class="inp" id="f-mtext" data-f="mText" rows="3">'+esc(ui.f.mText||'')+'</textarea></div><div class="row"><button type="button" class="btn primary" data-act="savemat">Добавить</button><button type="button" class="btn" data-act="matadd">Отмена</button></div></section>':'';
  return '<header class="head"><div><div class="eyebrow">Материалы обучения</div><h1>Материалы</h1></div>'+(staff?'<button type="button" class="btn primary" data-act="matadd">'+ic('plus')+'Добавить материал</button>':'')+'</header>'+addF+
    '<div class="cols mcols" style="align-items:start"><section class="card"><h2>Структура образования АБФФ</h2><p class="small muted" style="margin:4px 0 14px">Ступени тренерского образования'+(u.role==='student'?', ваша выделена':'')+'</p>'+ladder(u.role==='student'?u.cat:'')+'</section>'+
    '<div class="stack"><div class="row" style="gap:8px"><input class="inp" style="max-width:260px" id="f-mq" data-f="mq" data-live="1" placeholder="Поиск материала" aria-label="Поиск материала" value="'+esc(M.q)+'">'+chip('cat','all','Все категории')+Object.keys(CATS).map(c=>chip('cat',c,CATS[c].name)).join('')+'</div><div class="row" style="gap:8px">'+chip('type','all','Все типы')+Object.keys(TYPES).map(k=>chip('type',k,TYPES[k])).join('')+'</div>'+
    '<div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr))">'+(cards||'<div class="empty">Материалов по этим условиям нет.</div>')+'</div></div></div>';
}

/* ---------- отрисовка ---------- */
function render(){
  const app=document.getElementById('app');
  const ae=document.activeElement,fid=ae&&ae.id&&app.contains(ae)?ae.id:null,ss=fid&&ae.selectionStart!=null?[ae.selectionStart,ae.selectionEnd]:null;
  const u=me();
  if(!u){app.innerHTML=authView()}
  else{
    ui.route=parseRoute();
    let b;
    if(ui.route==='home')b=viewHome(u);
    else if(ui.route==='students')b=viewStudents(u);
    else if(ui.route==='reports')b=viewReports(u);
    else if(ui.route==='materials')b=viewMaterials(u);
    else b=viewStudent(u,ui.route.split('/')[1]);
    app.innerHTML=shell(b);
  }
  if(fid){const el=document.getElementById(fid);if(el){el.focus();if(ss&&el.setSelectionRange){try{el.setSelectionRange(ss[0],ss[1])}catch(e){}}}}
}

/* ---------- действия ---------- */
function openWork(id){
  const w=workById(id),u=me();if(!w)return;
  const o=byId(w.owner);
  ui.rep.sel=id;ui.rep.status='all';ui.rep.stu='all';ui.rep.grade=0;
  if(u.role==='curator')ui.rep.tab=w.owner===u.id?'b':'a';
  else if(u.role==='manager')ui.rep.tab=o.role==='curator'?'b':'a';
}
function act(a,b){
  const u=me(),v=b.dataset.v,id=b.dataset.id;
  switch(a){
    case 'pickrole':ui.auth.role=v;ui.auth.step='form';ui.auth.err='';ui.auth.mode='login';break;
    case 'authback':ui.auth.step='role';ui.auth.err='';break;
    case 'authback2':ui.auth.step='form';ui.auth.err='';break;
    case 'authmode':ui.auth.mode=v;ui.auth.err='';break;
    case 'regcat':ui.f.cat=v;break;
    case 'demo':ui.f.email=demoUser(ui.auth.role).email;ui.auth.err='';break;
    case 'resend':ui.auth.code=String(Math.floor(100000+Math.random()*900000));ui.auth.err='';ui.f.code='';toast('Новый код отправлен');break;
    case 'logout':state.session=null;save();ui.auth.step='role';ui.f={};location.hash='';toast('Вы вышли');break;
    case 'reset':if(!ui.resetAsk){ui.resetAsk=true;setTimeout(()=>{ui.resetAsk=false;render()},4000)}else{ui.resetAsk=false;state=seed();save();ui.f={};ui.auth={step:'role',role:'student',mode:'login',err:'',code:'',pending:null};location.hash='';toast('Демо-данные восстановлены')}break;
    case 'stfilter':ui.st[b.dataset.k]=v;if(b.dataset.k==='cur')ui.st.tab='students';break;
    case 'sttab':ui.st.tab=v;break;
    case 'mod':commit(st=>{const p=st.prog[id]=st.prog[id]||[];const i=p.indexOf(v);if(i>-1)p.splice(i,1);else p.push(v)});return;
    case 'openwork':openWork(id);break;
    case 'selwork':ui.rep.sel=id;ui.rep.grade=0;break;
    case 'repstatus':ui.rep.status=v;break;
    case 'reptab':ui.rep.tab=v;ui.rep.status='all';ui.rep.sel=null;ui.rep.stu='all';break;
    case 'assignopen':ui.assign=!ui.assign;if(location.hash!=='#reports')location.hash='reports';break;
    case 'assignsave':{
      const F=ui.f,list=studentsOf(u).concat(u.role==='manager'?state.users.filter(x=>x.role==='curator'):[]);
      const owner=F.asOwner||(list[0]&&list[0].id),title=(F.asTitle||'').trim();
      if(!title){toast('Укажите название задания');return}
      const due=F.asDue||addDays(todayDS(),7);
      const nw={id:'w'+uid(),owner:owner,title:title,kind:F.asKind||KINDS[0],status:due<todayDS()?'notsub':'wait',due:due,text:'',comments:[]};
      commit(st=>{st.works.push(nw)});ui.assign=false;ui.f.asTitle='';ui.rep.sel=nw.id;ui.rep.status='all';
      ui.rep.tab=byId(owner).role==='student'?'a':(u.role==='curator'?'b':'b');toast('Задание выдано');render();return}
    case 'submitwork':{
      const w=workById(id),txt=(ui.f['work_'+id]!==undefined?ui.f['work_'+id]:w.text).trim();
      if(txt.length<20){toast('Опишите работу подробнее, минимум 20 символов');return}
      commit(st=>{const x=st.works.find(z=>z.id===id);x.text=txt;x.status='submitted';x.submittedAt=todayDS()});delete ui.f['work_'+id];toast('Работа сдана');return}
    case 'takework':commit(st=>{const x=st.works.find(z=>z.id===id);x.status='review';x.reviewerId=u.id});toast('Работа на проверке');return;
    case 'grade':ui.rep.grade=+v;break;
    case 'checkwork':{
      if(!ui.rep.grade){toast('Выберите оценку');return}
      const g=ui.rep.grade,c=(ui.f.wc||'').trim();
      commit(st=>{const x=st.works.find(z=>z.id===id);x.status='checked';x.grade=g;x.checkedAt=todayDS();x.reviewerId=u.id;if(c)x.comments.push({id:uid(),by:u.id,at:todayDS(),text:c})});ui.f.wc='';ui.rep.grade=0;toast('Работа проверена');return}
    case 'returnwork':{
      const c=(ui.f.wc||'').trim();if(!c){toast('Напишите комментарий для доработки');return}
      commit(st=>{const x=st.works.find(z=>z.id===id);x.status='notsub';x.grade=null;x.comments.push({id:uid(),by:u.id,at:todayDS(),text:c});x.due=addDays(todayDS(),3)});ui.f.wc='';toast('Возвращено на доработку');return}
    case 'addwc':{const c=(ui.f.wc||'').trim();if(!c){toast('Напишите комментарий');return}commit(st=>{st.works.find(z=>z.id===id).comments.push({id:uid(),by:u.id,at:todayDS(),text:c})});ui.f.wc='';toast('Комментарий добавлен');return}
    case 'addnote':{const c=(ui.f.note||'').trim();if(!c){toast('Напишите комментарий');return}commit(st=>{st.notes.push({id:uid(),studentId:id,by:u.id,at:todayDS(),text:c})});ui.f.note='';toast('Комментарий добавлен');return}
    case 'matfilter':ui.mat[b.dataset.k]=v;break;
    case 'togmat':ui.mat.open=ui.mat.open===id?null:id;break;
    case 'readmat':commit(st=>{const r=st.read[u.id]=st.read[u.id]||{};if(r[id])delete r[id];else r[id]=todayDS()});return;
    case 'matadd':ui.mat.add=!ui.mat.add;break;
    case 'mcat':ui.cats[v]=ui.cats[v]===false?true:false;break;
    case 'savemat':{
      const t=(ui.f.mTitle||'').trim();if(!t){toast('Укажите название');return}
      const cs=Object.keys(CATS).filter(c=>ui.cats[c]!==false);if(!cs.length){toast('Выберите хотя бы одну категорию');return}
      commit(st=>{st.mats.push({id:'m'+uid(),type:ui.f.mType||'guide',cats:cs,title:t,meta:'Добавлено '+u.name,date:todayDS(),mandatory:false,text:(ui.f.mText||'').trim()||'Описание не указано.'})});
      ui.mat.add=false;ui.f.mTitle='';ui.f.mText='';ui.cats={};toast('Материал добавлен');return}
  }
  render();
}
document.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b)return;act(b.dataset.act,b)});
document.addEventListener('input',e=>{const t=e.target;if(!t.dataset||!t.dataset.f)return;ui.f[t.dataset.f]=t.value;
  if(t.dataset.f==='stq'){ui.st.q=t.value}
  if(t.dataset.f==='mq'){ui.mat.q=t.value}
  if(t.dataset.live)render();
});
document.addEventListener('change',e=>{const t=e.target;if(!t.dataset||!t.dataset.f)return;ui.f[t.dataset.f]=t.value;
  if(t.dataset.f==='repstu'){ui.rep.stu=t.value;ui.rep.sel=null;render()}
});
document.addEventListener('submit',e=>{
  const f=e.target.closest('[data-form]');if(!f)return;e.preventDefault();
  if(f.dataset.form==='sendcode'){sendCode();render()}
  else if(f.dataset.form==='verify'){if(verify()){toast('Вы вошли в систему')}render()}
});
ui.route=parseRoute();
render();
})();

</script>

</body></html>
