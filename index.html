/* Мир: вечерний стадион. Закат, газон с полосами, прожекторы, жёлтая карточка как акцент. Было: тёмный кабинет академии. Графитовые карточки с тонкой границей, золотой акцент, мятный для «успех». Имя и логотип свои. */
:root{
  --bg:#05080A;--side:#060B0A;--card:#0D1512;--card-2:#13201B;--line:#1C2824;--line-2:#2C3B35;
  --ink:#EEF3EE;--muted:#9DB0A6;--dim:#7F948A;
  --gold:#FFD21F;--gold-2:#E8B800;--gold-ink:#141005;--grad:linear-gradient(135deg,#FFE36B 0%,#FFC400 100%);
  --mint:#3FD98A;--teal:#46C6D8;--red:#F27A6C;--sunset:#E07A45;--turf:#1E6B3F;
  --r-lg:20px;--r-md:14px;--r-sm:10px;
  --font-d:'Unbounded Variable','Unbounded',system-ui,sans-serif;--font-t:'Onest Variable','Onest',system-ui,sans-serif;--font-m:'JetBrains Mono Variable','JetBrains Mono',ui-monospace,monospace;
  --ease:cubic-bezier(.2,.7,.2,1);
  color-scheme:dark}
*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{background:radial-gradient(900px 520px at 88% -8%,rgba(255,210,31,.08),transparent 62%),var(--bg);background-color:var(--bg);color:var(--ink);font:400 15px/1.55 var(--font-t);min-height:100vh}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0}
[hidden]{display:none!important}
::selection{background:var(--gold);color:var(--gold-ink)}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
h1,h2,h3{font-family:var(--font-d);font-weight:650;line-height:1.15;letter-spacing:-.02em;text-wrap:balance}
h3{font-family:var(--font-t);font-size:1.05rem;font-weight:650;letter-spacing:-.005em}
.muted{color:var(--muted)} .small{font-size:.875rem} .nw{white-space:nowrap}
.gold{color:var(--gold)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
svg.i{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.eyebrow{font:500 12px/1.4 var(--font-m);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}

/* shell */
.shell{display:grid;grid-template-columns:252px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:22px;padding:20px 14px;background:var(--side);border-right:1px solid var(--line)}
.logo{display:flex;align-items:center;gap:12px;text-align:left;padding:2px 6px}
.logo .mk{width:40px;height:40px;border-radius:50%;background:var(--grad);display:grid;place-items:center;color:var(--gold-ink);flex:none;box-shadow:0 6px 22px rgba(255,196,0,.25)}
.logo .mk svg{width:22px;height:22px}
.logo b{display:block;font:700 14px/1.1 var(--font-d);letter-spacing:.06em}
.logo small{display:block;font-size:12px;letter-spacing:.16em;color:var(--muted);text-transform:uppercase;margin-top:3px;white-space:nowrap}
.nav{display:flex;flex-direction:column;gap:4px}
.nav button{display:flex;align-items:center;gap:14px;min-height:44px;padding:0 14px;border-radius:14px;color:var(--muted);text-align:left;transition:background .18s,color .18s}
.nav button:hover{color:var(--ink);background:#0F1714}
.nav button[aria-current=page]{background:#13201B;color:var(--ink);box-shadow:inset 0 0 0 1px var(--line)}
.nav button[aria-current=page] svg{color:var(--gold)}
.ucard{margin-top:auto;border:1px solid var(--line);border-radius:var(--r-md);padding:14px;background:linear-gradient(180deg,#0E1513,#0A0F0D)}
.ucard .top{display:flex;align-items:center;gap:10px}
.av{width:38px;height:38px;border-radius:50%;flex:none;display:grid;place-items:center;font:700 13px var(--font-t);background:#16231D;border:1px solid var(--line-2);color:var(--gold)}
.ucard .nm{font-weight:600;line-height:1.2;font-size:.92rem}
.ucard .out{margin-left:auto;width:36px;height:36px;border-radius:10px;display:grid;place-items:center;color:var(--muted)}
.ucard .out:hover{background:#14211B;color:var(--ink)}
.ucard .lv{margin-top:14px;font-weight:600;font-size:.95rem}
.ucard .xp{font-size:12px;color:var(--muted);margin-top:6px}
.main{padding:20px clamp(16px,3.2vw,44px) 56px;min-width:0;max-width:1320px;width:100%}
.demo{font-size:12px;color:var(--dim);margin-bottom:18px;line-height:1.4}
.mtop{display:none}
.head{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:flex-end;justify-content:space-between;margin:6px 0 24px}
.head h1{font-size:clamp(1.55rem,2.7vw,2.2rem);margin-top:8px;font-weight:650}
.head .acts{display:flex;gap:10px;flex-wrap:wrap}

/* surfaces */
.card{position:relative;background:linear-gradient(180deg,#0F1714 0%,#0B110F 100%);border:1px solid var(--line);border-radius:var(--r-lg);padding:22px 24px;box-shadow:inset 0 1px 0 rgba(255,255,255,.035)}
.card>h3:first-child,.card>.eyebrow+h3{margin-top:2px}
.card .eyebrow{margin-bottom:8px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g-main{grid-template-columns:minmax(0,1.9fr) minmax(0,1fr)}
.mt{margin-top:16px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:46px;padding:0 22px;border-radius:999px;background:var(--grad);color:var(--gold-ink);font-weight:650;white-space:nowrap;transition:transform .12s,box-shadow .2s,filter .2s;box-shadow:0 8px 26px rgba(255,196,0,.18)}
.btn:hover{filter:brightness(1.06);box-shadow:0 10px 30px rgba(255,196,0,.3)}
.btn:active{transform:scale(.97)}
.btn.ghost{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1px var(--line-2)}
.btn.ghost:hover{background:#13201B}
.btn.sm{min-height:40px;padding:0 16px;font-size:.88rem}
.btn svg{width:18px;height:18px}
.pill{display:inline-flex;align-items:center;gap:7px;padding:4px 11px;border-radius:999px;font-size:12.5px;font-weight:550;white-space:nowrap;background:#13201B;color:var(--muted);box-shadow:inset 0 0 0 1px var(--line)}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;flex:none}
.pill.ok{color:var(--mint);background:rgba(78,209,161,.09);box-shadow:inset 0 0 0 1px rgba(78,209,161,.25)}
.pill.wait{color:var(--gold);background:rgba(255,210,31,.09);box-shadow:inset 0 0 0 1px rgba(255,210,31,.25)}
.pill.bad{color:var(--red);background:rgba(242,122,108,.09);box-shadow:inset 0 0 0 1px rgba(242,122,108,.28)}
.pill.rev{color:var(--teal);background:rgba(63,191,210,.09);box-shadow:inset 0 0 0 1px rgba(63,191,210,.25)}
.prog{height:8px;border-radius:99px;background:#1A2621;overflow:hidden}
.prog i{display:block;height:100%;border-radius:99px;background:var(--grad);transform-origin:left;animation:grow .9s var(--ease) both}
@keyframes grow{from{transform:scaleX(0)}}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:40px;padding:0 16px;border-radius:999px;color:var(--muted);box-shadow:inset 0 0 0 1px var(--line-2);font-size:.9rem;transition:.18s}
.chip:hover{color:var(--ink);background:#111A16}
.chip[aria-pressed=true]{background:var(--grad);color:var(--gold-ink);font-weight:650;box-shadow:none}

/* tiles & kpi */
.tile{display:flex;align-items:center;gap:14px;padding:16px 18px;min-height:76px;border-radius:var(--r-lg);border:1px solid var(--line);background:linear-gradient(180deg,#0F1714,#0B110F);text-align:left;transition:transform .2s var(--ease),border-color .2s}
.tile:hover{border-color:var(--line-2);transform:translateY(-2px)}
.tile .ic,.ic{width:44px;height:44px;border-radius:50%;flex:none;display:grid;place-items:center;background:#132019;color:var(--gold);box-shadow:inset 0 0 0 1px var(--line)}
.ic.gold{background:var(--grad);color:var(--gold-ink);box-shadow:none}
.tile b{display:block;font-weight:600;line-height:1.25}
.tile span.s{display:block;font-size:.82rem;color:var(--muted);line-height:1.3;margin-top:2px}
.kpi{padding:18px 20px}
.kpi .row1{display:flex;justify-content:space-between;align-items:center;gap:8px}
.kpi .row1 svg{color:var(--gold);width:19px;height:19px}
.kpi .v{font:600 clamp(1.3rem,1.9vw,1.65rem)/1.1 var(--font-d);margin-top:12px;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.kpi .v small{font-size:.55em;color:var(--muted);font-weight:600;margin-left:4px}
.kpi .d{font-size:.82rem;color:var(--muted);margin-top:6px}
.kpi.warn .v{color:var(--gold)}
.lock{display:flex;flex-wrap:wrap;gap:14px 20px;align-items:center;justify-content:space-between;border-color:rgba(255,210,31,.28);background:linear-gradient(180deg,rgba(255,210,31,.08),rgba(255,210,31,.03))}

/* hero */
.hero{border:1px solid var(--line);border-radius:28px;overflow:hidden;position:relative;background:radial-gradient(70% 90% at 100% 0%,rgba(255,210,31,.12),transparent 60%),radial-gradient(60% 70% at 0% 100%,rgba(78,209,161,.07),transparent 60%),#08100D}
.hero .lines{position:absolute;inset:0;width:100%;height:100%;opacity:.3;pointer-events:none}
.hero>.in{position:relative;padding:clamp(22px,3.4vw,44px)}
.hello{display:flex;align-items:center;gap:12px;margin-bottom:20px;flex-wrap:wrap}
.hello .av{width:44px;height:44px}
.hello .eyebrow{display:block}
.hero h1{font-size:clamp(1.75rem,3.9vw,3rem);font-weight:650;line-height:1.12;letter-spacing:-.03em}
.hero h1 em{font-style:normal;color:var(--gold)}
.hero .lead{max-width:48ch;color:var(--muted);margin:14px 0 24px;font-size:1.02rem}
.hero .acts{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.home-hero{display:flex;flex-wrap:wrap;gap:20px 40px;align-items:flex-end;justify-content:space-between}
.home-hero .lead{margin-bottom:0}
.hero-grid{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,.85fr);gap:36px;align-items:center}
.pv{display:flex;flex-direction:column;gap:12px}
.pv .card{padding:16px 18px;background:rgba(19,21,20,.86);backdrop-filter:blur(6px)}
.pv .card:nth-child(2){margin-left:28px}
.pv .card:nth-child(3){margin-left:10px}
.pv .r{display:flex;align-items:center;gap:14px}
.pv b{display:block;line-height:1.3}
.date{width:54px;flex:none;text-align:center;border-radius:14px;background:#13201B;padding:6px 0;box-shadow:inset 0 0 0 1px var(--line)}
.date b{font:600 1.15rem/1 var(--font-d)}
.date span{display:block;font-size:12px;letter-spacing:.1em;color:var(--gold);margin-top:3px}
.row{display:flex;align-items:center;gap:14px;justify-content:space-between;padding:14px 0;border-top:1px solid var(--line)}
.row:first-of-type{border-top:0}
.row .t{min-width:0;flex:1}
.row h3{font-size:1rem}
.num{width:36px;height:36px;border-radius:50%;flex:none;display:grid;place-items:center;font:700 .85rem var(--font-d);background:#132019;color:var(--gold);box-shadow:inset 0 0 0 1px var(--line)}

/* landing sections */
.pub-top{position:sticky;top:0;z-index:20;background:rgba(10,11,11,.82);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.pub-in{max-width:1240px;margin:0 auto;padding:12px clamp(16px,3vw,32px);display:flex;align-items:center;gap:20px}
.pub-in nav{margin-left:auto;display:flex;gap:4px}
.pub-in nav button{min-height:44px;padding:0 14px;border-radius:999px;color:var(--muted)}
.pub-in nav button:hover{color:var(--ink)}
.pub{max-width:1240px;margin:0 auto;padding:20px clamp(16px,3vw,32px) 40px}
.sec{margin-top:clamp(48px,7vw,88px)}
.sec-h{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:10px 30px;margin-bottom:22px}
.sec-h h2{font-size:clamp(1.4rem,2.6vw,2rem);font-weight:650;margin-top:8px}
.sec-h p{color:var(--muted);max-width:44ch}
.bento{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:16px}
.b-big{grid-column:span 4;grid-row:span 2}.b-s{grid-column:span 2}
.player{position:relative;aspect-ratio:16/8;border-radius:var(--r-md);margin:16px 0 14px;overflow:hidden;background:radial-gradient(60% 80% at 70% 0%,rgba(255,210,31,.16),transparent 70%),#07100C;border:1px solid var(--line);display:grid;place-items:center}
.player .lines{position:absolute;inset:0;width:100%;height:100%;opacity:.45}
.play{position:relative;width:64px;height:64px;border-radius:50%;background:var(--grad);color:var(--gold-ink);display:grid;place-items:center;box-shadow:0 10px 36px rgba(255,196,0,.35)}
.play svg{width:26px;height:26px;fill:currentColor;stroke:none;margin-left:3px}
.player .tag{position:absolute;left:14px;top:12px;font-size:12px}
.player .bar{position:absolute;left:16px;right:16px;bottom:14px;height:5px;border-radius:9px;background:rgba(255,255,255,.12)}
.player .bar i{display:block;width:34%;height:100%;border-radius:9px;background:var(--grad)}
.ringbox{display:flex;align-items:center;gap:16px;margin-top:10px}
.route{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:0;position:relative}
.route::before{content:"";position:absolute;left:10%;right:10%;top:21px;height:2px;background:linear-gradient(90deg,var(--gold-2) 0 40%,var(--line-2) 40%)}
.stop{position:relative;text-align:center;padding:0 10px}
.stop .n{width:44px;height:44px;border-radius:50%;margin:0 auto 14px;display:grid;place-items:center;font:700 .95rem var(--font-d);background:#101814;color:var(--muted);box-shadow:inset 0 0 0 1px var(--line-2);position:relative}
.stop.on .n{background:var(--grad);color:var(--gold-ink);box-shadow:0 6px 22px rgba(255,196,0,.25)}
.stop h3{font-size:1rem;margin-bottom:6px}
.stop p{font-size:.86rem;color:var(--muted)}
.cc{display:flex;flex-direction:column;gap:12px}
.cc .top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.cc p{color:var(--muted);font-size:.9rem;flex:1}
.cc .foot{display:flex;align-items:center;justify-content:space-between;gap:10px}
.ev{display:flex;gap:16px;align-items:flex-start}
.ev .acts{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:12px}
.plans{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.plan{display:flex;flex-direction:column;gap:6px;padding:26px 24px}
.plan.best{border:1px solid transparent;background:linear-gradient(#101814,#0B110F) padding-box,linear-gradient(135deg,#FFE36B,#6b5a10 55%,#FFC400) border-box;box-shadow:0 20px 60px rgba(255,196,0,.1)}
.plan .stamp{position:absolute;right:18px;top:-12px;background:var(--grad);color:var(--gold-ink);font-size:12px;font-weight:700;padding:4px 12px;border-radius:999px}
.plan .price{font:650 2.2rem/1 var(--font-d);margin-top:6px;font-variant-numeric:tabular-nums}
.plan .price small{font-size:.9rem;color:var(--muted);margin-left:6px;font-weight:600}
.plan ul{list-style:none;padding:0;margin:14px 0 20px;display:grid;gap:9px;color:var(--muted);font-size:.92rem}
.plan li{display:flex;gap:10px;align-items:flex-start}
.plan li::before{content:"";width:16px;height:16px;flex:none;margin-top:3px;border-radius:50%;background:rgba(78,209,161,.14) url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><path d='M4.5 8.3l2.3 2.3 4.7-5' fill='none' stroke='%234ED1A1' stroke-width='1.7' stroke-linecap='round' stroke-linejoin='round'/></svg>") center/16px}
details{border:1px solid var(--line);border-radius:var(--r-md);background:#0B110F;margin-bottom:10px}
summary{cursor:pointer;min-height:56px;padding:14px 20px;display:flex;align-items:center;justify-content:space-between;gap:12px;font-weight:600;list-style:none}
summary::-webkit-details-marker{display:none}
summary::after{content:"+";font-size:1.4rem;color:var(--gold);transition:transform .2s}
details[open] summary::after{transform:rotate(45deg)}
details p{padding:0 20px 18px;color:var(--muted)}
.cta{text-align:center;padding:clamp(32px,6vw,64px) 24px}
.cta h2{font-size:clamp(1.5rem,3.4vw,2.5rem);font-weight:650;margin-bottom:22px}
.cta .acts{display:flex;justify-content:center;gap:12px;flex-wrap:wrap}
footer{margin-top:48px;padding-top:20px;border-top:1px solid var(--line);font-size:12.5px;color:var(--dim)}

/* forms, tables */
.f{display:flex;flex-direction:column;gap:6px;margin-bottom:14px;font-size:.86rem;color:var(--muted);font-weight:550}
input[type=text],input[type=datetime-local],select{padding:10px 14px;min-height:46px;border:1px solid var(--line-2);background:#08100D;color:var(--ink);border-radius:var(--r-sm);max-width:100%;width:100%}
input:focus,select:focus{outline:2px solid var(--gold);outline-offset:0;border-color:transparent}
select{appearance:none;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='12' height='8'><path d='M1 1l5 5 5-5' fill='none' stroke='%23A5A7A1' stroke-width='1.6'/></svg>");background-repeat:no-repeat;background-position:right 14px center;padding-right:38px}
.scroll{overflow-x:auto;margin:0 -8px;padding:0 8px}
table{width:100%;border-collapse:collapse;min-width:560px}
th{text-align:left;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:500;padding:10px 12px;border-bottom:1px solid var(--line)}
td{padding:12px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
tbody tr:hover{background:rgba(255,255,255,.02)}
.opt{display:block;width:100%;text-align:left;padding:13px 16px;min-height:48px;margin-bottom:8px;border:1px solid var(--line-2);background:#08100D;border-radius:var(--r-sm);transition:.16s}
.opt:hover{border-color:var(--gold);background:#0E1513}
.opt.right{background:rgba(78,209,161,.12);border-color:var(--mint);color:var(--mint)}
.opt.wrong{background:rgba(242,122,108,.1);border-color:var(--red);color:var(--red)}
.toast{position:fixed;left:50%;bottom:calc(88px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#13201B;color:var(--ink);padding:11px 20px;border-radius:999px;font-size:.9rem;z-index:60;border:1px solid var(--gold-2);box-shadow:0 12px 40px rgba(0,0,0,.5)}
@media(min-width:861px){.toast{bottom:28px}}
.pay{border:1px dashed var(--line-2);border-radius:var(--r-md);padding:20px;background:#08100D;margin-top:12px}

/* charts */
.chart text{font:12px var(--font-t);fill:var(--muted)}
.chart .ln{stroke-dasharray:1;stroke-dashoffset:0}
.chart.go .ln{animation:draw 1.4s var(--ease) both}
@keyframes draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
.leg{display:grid;gap:10px;margin-top:16px;font-size:.9rem}
.leg div{display:flex;align-items:center;gap:10px}
.leg i{width:10px;height:10px;border-radius:50%;flex:none}
.leg span{flex:1;color:var(--muted)}
.leg b{font-variant-numeric:tabular-nums}
.donut{position:relative;width:168px;margin:6px auto 0}
.donut .c{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.donut .c b{font:650 1.5rem/1 var(--font-d)}
.donut .c span{font-size:12px;color:var(--muted)}
.fun{display:grid;gap:14px;margin-top:14px}
.fun .l{display:flex;justify-content:space-between;gap:10px;font-size:.9rem;margin-bottom:6px}
.fun .l b{font-variant-numeric:tabular-nums}
.fun .bar{height:12px;border-radius:99px;background:#16211C;overflow:hidden}
.fun .bar i{display:block;height:100%;border-radius:99px;animation:grow .9s var(--ease) both}

.hero .in>*,.pv .card{animation:rise .7s var(--ease) both}
.pv .card:nth-child(2){animation-delay:.12s}.pv .card:nth-child(3){animation-delay:.24s}
@keyframes rise{from{opacity:0;transform:translateY(14px)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}

/* v5: клубы, сертификат, семья */
.club-pack{display:flex;flex-direction:column;gap:22px}
.club-price{display:flex;flex-wrap:wrap;gap:14px 24px;align-items:center;justify-content:space-between;padding-top:20px;border-top:1px solid var(--line)}
.price-l{font:650 1.9rem/1.1 var(--font-d);margin:4px 0}
.price-l small{font-size:.95rem;color:var(--muted);font-weight:600}
.cert-mini{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.cert-mini .eyebrow{margin-bottom:4px}
.home-talk{display:flex;gap:16px;align-items:flex-start;border-color:rgba(255,210,31,.25)}
.home-talk ol{padding-left:20px;display:grid;gap:8px}
.cert{border:1px solid transparent;background:radial-gradient(80% 90% at 100% 0%,rgba(255,210,31,.14),transparent 60%) padding-box,linear-gradient(#101814,#0B110F) padding-box,linear-gradient(135deg,#FFE36B,#4a3f10 50%,#FFC400) border-box}
.cert-top{display:flex;justify-content:space-between;align-items:center}
.cert-no{display:flex;justify-content:space-between;gap:12px;margin:16px 0 14px;padding:12px 14px;border-radius:12px;border:1px dashed var(--line-2);font:700 1rem var(--font-d);letter-spacing:.06em;font-variant-numeric:tabular-nums}
.cert-no span:last-child{color:var(--muted);font-weight:500;letter-spacing:0;font-size:.9rem}
.cert-res{display:flex;gap:12px;align-items:flex-start;margin-top:14px;padding:12px 14px;border-radius:12px}
.cert-res.ok{background:rgba(78,209,161,.09);color:var(--mint);box-shadow:inset 0 0 0 1px rgba(78,209,161,.25)}
.cert-res.bad{background:rgba(242,122,108,.08);color:var(--red);box-shadow:inset 0 0 0 1px rgba(242,122,108,.25)}
.cert-res p{color:var(--ink)}
.code-row{display:flex;flex-wrap:wrap;gap:12px 16px;align-items:flex-end}
.btn.ghost[aria-pressed=true]{color:var(--mint);box-shadow:inset 0 0 0 1px rgba(78,209,161,.4)}

.au{display:flex;gap:10px;align-items:flex-start}.au .av{width:32px;height:32px;font-size:11px}.au p{line-height:1.4}
.lp{max-width:66ch;margin-top:14px}
.keys{margin-top:20px;padding:16px 20px;border-radius:14px;background:#08100D;border:1px solid var(--line);max-width:760px}
.keys ul{padding-left:18px;display:grid;gap:8px}
.keys li::marker{color:var(--gold)}
.srcs{margin-top:16px;max-width:760px}
.srcs a{color:var(--gold);text-underline-offset:3px}
html,body{overflow-x:clip}
#plans{position:relative;padding:56px 0 60px;isolation:isolate}
#plans::before{content:"";position:absolute;top:0;bottom:0;left:-100vmax;right:-100vmax;z-index:-1;background:radial-gradient(60% 80% at 50% 0%,rgba(255,255,255,.08),transparent 70%),repeating-linear-gradient(90deg,#1E6B3F 0 120px,#237647 120px 240px)}
#plans .sec-h p,#plans>.small{color:#D6E6DC}
#plans .eyebrow{color:#CFE3D6}

/* v7: кино-история на прокрутке */
.pub-top.over{position:fixed;left:0;right:0;top:0;background:linear-gradient(rgba(5,8,10,.75),rgba(5,8,10,0));border-bottom:0;backdrop-filter:none}
.pub-top.over .pub-in nav{background:rgba(10,16,14,.5);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.12);border-radius:999px;padding:3px}
.story{position:relative;height:500vh;background:var(--bg)}
.stage{position:sticky;top:0;height:100svh;overflow:hidden;background:#05080A}
.stage canvas{position:absolute;inset:0;width:100%!important;height:100%!important;display:block}
.poster{position:absolute;inset:0;background:radial-gradient(60% 45% at 78% 58%,rgba(255,170,90,.55),transparent 70%),linear-gradient(180deg,#14203a 0%,#4a3a52 38%,#c8643a 58%,#0e2a1a 58.5%,#1e6b3f 100%);transition:opacity .9s var(--ease)}
.poster .lines{position:absolute;left:-10%;right:-10%;bottom:-6%;height:48%;width:120%;opacity:.55;transform:perspective(600px) rotateX(58deg);transform-origin:bottom}
.stage.gl-on .poster{opacity:0}
.stage::after{content:"";position:absolute;inset:0;pointer-events:none;z-index:1;background:linear-gradient(90deg,rgba(5,8,10,.86) 0%,rgba(5,8,10,.55) 34%,rgba(5,8,10,0) 60%),linear-gradient(0deg,rgba(5,8,10,.85) 0%,rgba(5,8,10,0) 22%)}
.hud{position:absolute;left:clamp(16px,5vw,72px);right:clamp(16px,5vw,72px);bottom:26px;z-index:2;display:flex;align-items:center;gap:18px;font:500 12px/1 var(--font-m);color:var(--muted);letter-spacing:.06em}
.hud b{color:var(--ink);font-weight:600}
.hud .bar{flex:1;height:2px;background:rgba(255,255,255,.14);border-radius:2px;overflow:hidden}
.hud .bar i{display:block;height:100%;background:var(--gold);transform-origin:left;transform:scaleX(0)}
.hud .hint{display:flex;align-items:center;gap:8px}
.hud .hint i{width:14px;height:22px;border:1.5px solid var(--muted);border-radius:8px;position:relative}
.hud .hint i::after{content:"";position:absolute;left:50%;top:4px;width:2px;height:5px;margin-left:-1px;background:var(--gold);border-radius:2px;animation:wheel 1.6s var(--ease) infinite}
@keyframes wheel{0%{transform:translateY(0);opacity:1}70%{transform:translateY(7px);opacity:0}100%{opacity:0}}
.steps{position:relative;margin-top:-100svh;z-index:3}
.step{min-height:100svh;display:flex;align-items:center;padding:110px clamp(16px,5vw,72px) 100px}
.step .in{max-width:600px}
.stepchip{display:inline-flex;align-items:center;gap:10px;padding:7px 14px 7px 8px;border-radius:999px;font:500 12px/1 var(--font-m);letter-spacing:.06em;text-transform:uppercase;color:var(--ink);background:rgba(10,16,14,.55);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.12);margin-bottom:22px}
.stepchip b{background:var(--gold);color:var(--gold-ink);border-radius:999px;padding:4px 8px;font-weight:700}
.step h1,.step h2{font:650 clamp(2rem,4.6vw,4rem)/1.06 var(--font-d);letter-spacing:-.035em;text-wrap:balance}
.step h1 em,.step h2 em{font-style:normal;color:var(--gold)}
.step p.lead{color:#C9D6CF;font-size:clamp(1rem,1.3vw,1.15rem);max-width:46ch;margin:18px 0 26px}
.step .acts{display:flex;flex-wrap:wrap;gap:12px}
.glass{background:rgba(10,16,14,.55);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.12);border-radius:18px}
.gstats{display:flex;flex-wrap:wrap;gap:10px}
.gstats div{padding:12px 16px;min-width:120px}
.gstats b{display:block;font:600 1.5rem/1.1 var(--font-d);color:var(--ink)}
.gstats span{font-size:.82rem;color:var(--muted)}
.gcard{display:flex;gap:14px;align-items:center;padding:14px 16px;max-width:440px}
.gcard .date{background:rgba(255,255,255,.06)}
.gcard .num{font:600 1rem var(--font-m);letter-spacing:.06em;color:var(--gold);white-space:nowrap}
.gplan{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:26px}
.gplan div{padding:12px 16px}
.gplan b{font:600 1.35rem/1 var(--font-d)}
.gplan span{display:block;font-size:.8rem;color:var(--muted);margin-top:4px}
@media(max-width:760px){
  .step{align-items:flex-end;padding:90px 16px 76px}
  .stage::after{background:linear-gradient(0deg,rgba(5,8,10,.95) 0%,rgba(5,8,10,.7) 38%,rgba(5,8,10,0) 65%)}
  .step p.lead{margin:12px 0 18px}
  .hud .hint{display:none}
  .gstats div{min-width:0;flex:1}
  .gplan{flex-wrap:nowrap;gap:8px}.gplan div{flex:1;padding:10px 12px}.gplan b{font-size:1.05rem}
}
@media(max-width:1100px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g-main{grid-template-columns:1fr}.hero-grid{grid-template-columns:1fr}.pv .card:nth-child(n){margin-left:0}.route{grid-template-columns:1fr;gap:18px}.route::before{display:none}.stop{display:flex;text-align:left;gap:14px;padding:0}.stop .n{margin:0}.plans{grid-template-columns:1fr}.bento{grid-template-columns:1fr 1fr}.b-big{grid-column:span 2;grid-row:auto}.b-s{grid-column:span 1}}
@media(max-width:860px){
  .shell{grid-template-columns:1fr}
  .side{position:fixed;inset:auto 0 0 0;top:auto;height:auto;z-index:40;flex-direction:row;padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));gap:0;border-right:0;border-top:1px solid var(--line);background:rgba(12,13,13,.94);backdrop-filter:blur(14px)}
  .side .logo,.side .ucard{display:none}
  .nav{flex-direction:row;width:100%;gap:2px}
  .nav button{flex:1;flex-direction:column;justify-content:center;gap:3px;padding:6px 2px;min-height:54px;font-size:12px;text-align:center;border-radius:12px}
  .main{padding-bottom:100px}
  .mtop{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
  .mtop .logo .mk{width:34px;height:34px}
  .g3,.g2{grid-template-columns:1fr}
  .head{margin-bottom:18px}
}
@media(max-width:620px){
  .g4{grid-template-columns:1fr 1fr;gap:12px}.g4 .kpi{padding:14px}
  .bento{grid-template-columns:1fr}.b-big,.b-s{grid-column:auto}
  .pub-in nav{display:none}.pub-in .btn{margin-left:auto}
  .card{padding:18px}.btn.sm{min-height:44px}.chip{min-height:44px}
  .hero .acts .btn{flex:1}
  .ev{flex-direction:column;gap:12px}
  table{min-width:520px}
}

/*@baza:start*/const BAZA={"version": "2026-10-22", "sources": {"hk": ["Harwood, Knight (2015). Parenting in youth sport: a position paper on parenting expertise", "https://cronfa-dev.swansea.ac.uk/Record/cronfa19146/Download/0019146-10042015105042.pdf"], "bib": ["Balance is Better (Sport NZ): What makes an expert sports parent?", "https://balanceisbetter.org.nz/what-makes-an-expert-sports-parent/"], "car": ["Университет Торонто: исследование К. Тамминен о дороге домой (2017)", "https://utoronto.ca/news/after-game-how-parents-can-improve-car-ride-home-young-athletes"], "speu": ["Sport Parent EU (Erasmus+, Университет Суонси): советы родителям", "https://cdn.athletic-club.eus/uploads/2022/11/Promoting%20the%20health,%20wellbeing%20and%20enjoyment%20of%20Children%20and%20young%20people%20involved%20in%20sport.%20Tips%20for%20Parents.pdf"], "pca": ["Positive Coaching Alliance: эмоциональный бак и «магическое соотношение»", "https://positivecoach.org/our-super-bowl-spot/"], "visek": ["Visek и др. (2015). The fun integration theory", "https://scholars.georgiasouthern.edu/en/publications/the-fun-integration-theory-toward-sustaining-children-and-adolesc/"], "jh": ["Johns Hopkins Medicine: ранняя специализация в детском спорте", "https://www.hopkinsmedicine.org/health/conditions-and-diseases/sports-injuries/youth-sport-specialization"], "sleep": ["AMSSM Play.Stay.Thrive: сколько спать юному спортсмену", "https://playstaythrive.amssm.org/article/19/Athlete-Well-Being/How-much-sleep-should-my-athlete-be-getting/"], "nsca": ["NSCA: Feeding the Youth Athlete — Three Key Messages", "https://www.nsca.com/education/articles/nsca-coach/feeding-the-youth-athlete-three-key-messages/"], "cdc": ["CDC HEADS UP: сотрясение мозга, памятка для родителей", "https://www.cdc.gov/headsup/pdfs/youthsports/parents_eng.pdf"], "nspcc": ["NSPCC Child Protection in Sport Unit: информация для родителей", "https://uefa-safeguarding.eu/child-protection-sport-information-parents-nspcc-child-protection-sport-unit"], "rae": ["Balance is Better: эффект относительного возраста", "https://balanceisbetter.org.nz/relative-age-effect/"], "fun": ["British Fencing: обзор исследования Визек о «весёлом» спорте", "https://britishfencing.com/fun"]}, "courses": [{"id": 1, "t": "Родитель на трибуне", "sport": "all", "cert": 1, "by": "Редакция «Трибуны»", "basis": "Harwood и Knight, Sport Parent EU, Университет Торонто", "about": "Базовый курс: шесть умений спортивного родителя. После него — сертификат.", "lessons": [{"id": 11, "t": "Шесть умений спортивного родителя", "min": 6, "body": ["Британские исследователи Крис Харвуд и Камилла Найт описали, чем отличаются родители, рядом с которыми дети дольше остаются в спорте и лучше раскрываются. Они выделили шесть умений. Ни одно из них не требует разбираться в технике или тактике.", "Этим умениям можно научиться. Курс разбирает их по очереди, начиная с самого заметного — поведения на соревнованиях."], "points": ["Выбирать секцию под возраст и желания ребёнка, а не под чужие ожидания.", "Сочетать тепло и понятные правила, оставляя ребёнку самостоятельность: форму и сумку он собирает сам.", "Держать свои эмоции на соревнованиях и хвалить за старание и отношение.", "Строить ровные отношения с тренером и другими родителями.", "Планировать деньги, время и учёбу так, чтобы братья и сёстры не оставались в стороне.", "Менять свою роль по мере взросления ребёнка."], "q": "Что из этого входит в умения спортивного родителя?", "o": ["Разбирать с ребёнком тактику после каждой игры", "Давать ребёнку самому собирать форму и сумку", "Выбирать секцию по числу побед"], "r": 1, "home": ["Что тебе больше всего нравится в твоём спорте?", "Что я могу делать, чтобы тебе было легче на тренировках и играх?"], "src": ["hk", "bib"]}, {"id": 12, "t": "Эмоции на трибуне", "min": 6, "body": ["Дети видят трибуну лучше, чем кажется. Подсказки с трибуны спорят с указаниями тренера, а крик на судью учит, что виноваты другие. Сами юные спортсмены больше всего ценят родителя, который поддерживает, и меньше всего — «безумного фаната».", "Если держать себя в руках трудно, возьмите на соревновании поручение: вода, секундомер, фотографии. Занятые руки помогают успокоиться."], "points": ["Хвалите старание, смелость и отношение к команде, а не только результат.", "Технику и тактику оставьте тренеру: никаких подсказок с трибуны.", "Судья, тренер и соперники — часть игры; спорить с ними не ваша роль.", "Если ребёнок расстроен, сначала просто побудьте рядом."], "q": "Что лучше сделать с трибуны во время соревнования?", "o": ["Подсказывать, что делать", "Поддерживать всю команду", "Спорить с судьёй"], "r": 1, "home": ["Что тебе больше всего нравится, когда я смотрю твою игру?", "Есть ли что-то, что тебе мешает, когда я на трибуне?"], "src": ["hk", "bib"]}, {"id": 13, "t": "Дорога домой после игры", "min": 5, "body": ["Канадский исследователь Кэтрин Тамминен в 2017 году поговорила с 27 спортсменами 11–16 лет и их родителями о том, что происходит в машине после игр. Универсального рецепта нет, но ошибки повторяются: разбор сразу после финального свистка, разговор, который всегда начинается с плохого, и обвиняющий тон.", "В машине вы сидите рядом, а не напротив, поэтому дети иногда раскрываются именно там. Но молчание и наушники — тоже способ остыть. Спросите, когда ребёнок хочет поговорить: сейчас, после ужина или завтра."], "points": ["Сначала дайте эмоциям остыть — и себе тоже.", "Договоритесь о «правилах дороги»: например, начинать с хорошего.", "Трудный разговор об ошибках возможен, но спокойный и без обвинений.", "Цель — чтобы ребёнок не боялся поездки домой."], "q": "С чего начать разговор после неудачного выступления?", "o": ["С разбора ошибок", "С вопроса, как он себя чувствует", "Со сравнения с другими"], "r": 1, "home": ["Какой момент сегодня был самым приятным?", "Хочешь сейчас поговорить об игре или позже?"], "src": ["car"]}, {"id": 14, "t": "Родитель и тренер", "min": 5, "body": ["Тренер отвечает за тренировки, родитель — за поддержку дома. Ребёнку легче, когда взрослые говорят одно и то же. Если при нём критиковать тренера, он перестаёт доверять обоим.", "При этом тренеру важно знать, что происходит у ребёнка: болезнь, экзамены, переезд, тревога перед стартами. Сообщайте об этом коротко и заранее. Вопросы к решениям тренера задавайте лично и спокойно, не при команде."], "points": ["Признавайте авторитет тренера, особенно при ребёнке.", "Делитесь важным: здоровье, нагрузка в школе, настроение.", "Претензии — лично, спокойно и о конкретной ситуации.", "Не помогло — обращайтесь к администрации секции."], "q": "Где обсуждать претензию к тренеру?", "o": ["В общем чате родителей", "Во время тренировки при детях", "Лично и спокойно, затем при необходимости с администрацией"], "r": 2, "home": ["Понятно ли тебе, что тренер просит делать на тренировке?", "Если что-то непонятно, как ты можешь спросить тренера сам?"], "src": ["hk", "speu"]}]}, {"id": 5, "t": "Мотивация и радость от спорта", "sport": "all", "by": "Редакция «Трибуны»", "basis": "Visek, Positive Coaching Alliance, Sport Parent EU", "about": "Почему дети бросают спорт и как сохранить интерес без давления.", "lessons": [{"id": 51, "t": "Почему дети бросают спорт", "min": 6, "body": ["По оценке, которую приводит Johns Hopkins Medicine, около 70% детей уходят из организованного спорта к 13 годам. Чаще всего причина в том, что спорт перестал приносить удовольствие.", "Американская исследовательница Аманда Визек вместе с детьми, тренерами и родителями из детского футбола собрала 81 составляющую удовольствия от спорта. Выше всего дети оценили старание, дружную команду и хорошего тренера, а победу поставили лишь на 48-е место."], "points": ["Интерес держится на прогрессе, дружбе и хорошем тренере, а не только на победах.", "Спрашивайте ребёнка, что ему нравится в тренировках, и прислушивайтесь.", "Потеря интереса, усталость и желание бросить — повод поговорить, а не давить."], "q": "Что чаще всего удерживает ребёнка в спорте?", "o": ["Только победы и медали", "Ощущение прогресса, друзья и поддержка", "Строгий контроль родителей"], "r": 1, "home": ["Что было самым интересным на тренировках на этой неделе?", "Если бы ты мог поменять что-то в тренировках, что бы это было?"], "src": ["jh", "visek", "fun"]}, {"id": 52, "t": "Хвалить старание, а не талант", "min": 5, "body": ["Похвала «ты талант» приятна, но учит, что успех дан от природы. Тогда ошибка воспринимается как доказательство, что таланта нет. Европейский проект Sport Parent EU советует хвалить старание и то, как ребёнок работал, а неудачу разбирать как опыт.", "В Positive Coaching Alliance говорят об «эмоциональном баке»: ребёнок с полным баком лучше учится и играет. Чтобы бак не пустел, на каждое замечание должно приходиться около пяти конкретных и честных похвал — «магическое соотношение»."], "points": ["Хвалите конкретно: «ты не сдавался до конца», а не просто «молодец».", "На одно замечание — около пяти искренних похвал.", "После неудачи спросите, чему она научила."], "q": "Какая похвала лучше поддерживает мотивацию?", "o": ["«Ты прирождённый талант»", "«Ты бился до последней секунды»", "«Ты лучше всех в команде»"], "r": 1, "home": ["Чем ты гордишься после этой недели?", "Что у тебя получилось благодаря тренировкам?"], "src": ["speu", "pca"]}, {"id": 53, "t": "Если не взяли в команду", "min": 5, "body": ["Рано или поздно ребёнок окажется в запасе, не пройдёт отбор или проиграет важный старт. Харвуд и Найт советуют помочь увидеть в этом урок и не подрывать решение тренера при ребёнке.", "Не обесценивайте чувства: обида и злость нормальны. Сначала выслушайте, потом вместе подумайте, что улучшить, и спросите тренера, над чем работать. Ранний отбор плохо предсказывает будущее, так что одна неудача ничего не решает."], "points": ["Сначала выслушайте и признайте чувства.", "Не ругайте тренера при ребёнке, даже если не согласны.", "Вместе составьте план: над чем работать и у кого спросить совета."], "q": "Ребёнка не взяли в основной состав. Что поможет лучше всего?", "o": ["Сказать, что тренер несправедлив", "Выслушать и вместе решить, над чем работать", "Сразу перевести в другую секцию"], "r": 1, "home": ["Как ты себя чувствуешь после отбора?", "Что ты хочешь спросить у тренера?"], "src": ["hk", "speu"]}]}, {"id": 2, "t": "Спорт и учёба в 13–17 лет", "sport": "all", "by": "Редакция «Трибуны»", "basis": "AMSSM, Sport Parent EU, Harwood и Knight", "about": "Режим, нагрузка и мотивация подростка. Как меняется роль родителя.", "lessons": [{"id": 21, "t": "Сон, учёба и тренировки", "min": 6, "body": ["У подростка-спортсмена три нагрузки сразу: школа, тренировки и жизнь с друзьями. Если что-то вытесняет сон, страдают и учёба, и результаты. Американская академия медицины сна рекомендует подросткам 13–18 лет спать 8–10 часов в сутки, детям 6–12 лет — 9–12 часов.", "Недосып связан с большим числом травм и болезней. Простые правила: выключать экраны за час до сна, не держать телефон в спальне, ложиться примерно в одно время."], "points": ["Подросткам 8–10 часов сна, детям 6–12 лет — 9–12 часов.", "Телефон и компьютер — за час до сна и вне спальни.", "Часто устаёт и теряет интерес — обсудите нагрузку с тренером."], "q": "Что делать, если ребёнок часто устаёт и теряет интерес?", "o": ["Увеличить число тренировок", "Обсудить нагрузку с тренером", "Ничего, само пройдёт"], "r": 1, "home": ["Хватает ли тебе сна в дни тренировок?", "Что можно убрать из недели, чтобы было легче?"], "src": ["sleep"]}, {"id": 22, "t": "Мотивация без давления", "min": 5, "body": ["Подростку важнее чувствовать собственный прогресс, чем слышать о местах и медалях. Когда родитель спрашивает только о результате, спорт начинает казаться экзаменом.", "Sport Parent EU советует вовлекать подростка в решения: какие цели ставить, сколько тренироваться, на какие соревнования ехать. Свои цели защищают охотнее, чем навязанные."], "points": ["Спрашивайте «что получилось», а не «какое место».", "Пусть подросток сам ставит цели, вы помогаете их уточнить.", "Сравнивайте его с ним самим месяц назад, а не с другими."], "q": "Какой вопрос помогает мотивации?", "o": ["Какое место ты занял?", "Что у тебя сегодня получилось?", "Почему ты не победил?"], "r": 1, "home": ["Чему ты научился за этот месяц?", "Какую цель хочешь поставить себе сам?"], "src": ["speu"]}, {"id": 23, "t": "Когда спорт становится серьёзным", "min": 6, "body": ["Харвуд и Найт описывают, как меняется роль родителя. На раннем этапе родитель даёт попробовать разное, возит на тренировки и следит, чтобы было интересно. Когда ребёнок выбирает один вид спорта, растут нагрузка и логистика, и важнее всего становится эмоциональная поддержка.", "Дальше ведущую роль берут тренеры. Родитель отходит на шаг назад, но остаётся рядом: вместе с подростком решает вопросы учёбы и будущего и поддерживает его независимо от результата."], "points": ["Сначала — пробовать разное и получать удовольствие.", "Выбран один вид — больше эмоциональной поддержки и помощи с режимом.", "Дальше — меньше контроля, больше доверия тренеру и самому подростку.", "Поддержка не зависит от результата."], "q": "Подросток выбрал один вид спорта, нагрузка выросла. Что важнее всего от родителя?", "o": ["Контролировать каждую тренировку", "Эмоциональная поддержка и помощь с режимом", "Чаще давать советы по технике"], "r": 1, "home": ["Что тебе сейчас нужнее от меня: помощь с режимом или просто поддержка?", "Какие решения про спорт ты хочешь принимать сам?"], "src": ["hk"]}]}, {"id": 3, "t": "Здоровье: питание и нагрузка", "sport": "all", "by": "Редакция «Трибуны»", "basis": "NSCA, Johns Hopkins Medicine, Sport Parent EU", "about": "Еда и вода в дни тренировок, разумная нагрузка и признаки выгорания.", "lessons": [{"id": 31, "t": "Еда и вода в дни тренировок", "min": 7, "body": ["Национальная ассоциация силы и физической подготовки США (NSCA) сводит питание юного спортсмена к трём правилам: пить в основном воду, есть больше растительной пищи и не пропускать завтрак. Sport Parent EU добавляет принцип «сначала еда»: всё нужное ребёнок получает из обычной разнообразной пищи.", "Если ранняя тренировка не оставляет времени на завтрак, подойдёт небольшой перекус: банан, фруктовое пюре, злаковый батончик. Энергетические напитки до 18 лет не рекомендуются из-за кофеина. Спортивные добавки — только после консультации с врачом."], "points": ["Основа питья — вода, бутылка с собой на каждую тренировку.", "Фрукты и овощи — примерно половина тарелки.", "Завтрак каждый день, хотя бы небольшой.", "Без энергетиков; добавки — только по совету врача."], "q": "Ребёнок не успевает позавтракать перед утренней тренировкой. Что лучше?", "o": ["Ничего, поест после", "Энергетический напиток", "Небольшой перекус: банан или батончик"], "r": 2, "home": ["Что ты любишь есть перед тренировкой?", "Хватает ли тебе воды на тренировке?"], "src": ["nsca", "speu"]}, {"id": 32, "t": "Один вид спорта или несколько", "min": 7, "body": ["Американская академия педиатрии советует откладывать узкую специализацию до 15–16 лет. Дети, которые пробуют разное, дольше остаются активными. Около половины травм в детском спорте — травмы от перегрузки, от однообразных повторяющихся движений.", "Если ребёнок уже сосредоточен на одном виде спорта, Национальная ассоциация спортивных тренеров США (NATA) предлагает простые ограничения. Sport Parent EU даёт похожее правило про часы в неделю."], "points": ["Часов тренировок в неделю — не больше, чем лет ребёнку.", "Минимум 2 дня отдыха в неделю.", "Не больше 8 месяцев в году в одном виде спорта.", "Перерыв после каждого сезона."], "q": "Ребёнку 11 лет. Какой разумный предел тренировок в неделю в одном виде спорта?", "o": ["Не больше 11 часов", "Около 16 часов", "Без ограничений, если тренер не против"], "r": 0, "home": ["Бывают ли дни, когда хочется отдохнуть, но приходится тренироваться?", "Хотел бы ты попробовать ещё какой-то спорт?"], "src": ["jh", "speu"]}, {"id": 33, "t": "Перегрузка и выгорание", "min": 5, "body": ["Выгорание редко случается внезапно. Ребёнок постепенно теряет /* ---------- графики ---------- */
function areaChart(w,labels,vals){
  const h=290,pl=38,pr=16,pt=16,pb=30,iw=w-pl-pr,ih=h-pt-pb;
  const max=Math.ceil(Math.max(...vals)*1.2/4)*4||4;
  const x=i=>pl+iw*i/(vals.length-1),y=v=>pt+ih*(1-v/max);
  let d=`M${x(0)} ${y(vals[0])}`;
  for(let i=1;i<vals.length;i++){const mx=(x(i-1)+x(i))/2;d+=` C${mx} ${y(vals[i-1])} ${mx} ${y(vals[i])} ${x(i)} ${y(vals[i])}`}
  const grid=[0,1,2,3,4].map(k=>{const v=max*k/4,yy=y(v);return `<line x1="${pl}" x2="${w-pr}" y1="${yy}" y2="${yy}" stroke="#262a2b" stroke-width="1"/><text x="${pl-8}" y="${yy+4}" text-anchor="end">${Math.round(v)}</text>`}).join('');
  const xl=labels.map((l,i)=>`<text x="${x(i)}" y="${h-8}" text-anchor="${i===0?'start':i===labels.length-1?'end':'middle'}">${l}</text>`).join('');
  const lx=x(vals.length-1),ly=y(vals[vals.length-1]);
  return `<svg class="chart" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" role="img" aria-label="Подписчики по месяцам: ${labels.map((l,i)=>l+' '+vals[i]).join(', ')}"><defs><linearGradient id="ag" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFD21F" stop-opacity=".34"/><stop offset="1" stop-color="#FFD21F" stop-opacity="0"/></linearGradient></defs>${grid}
   <path d="${d} L${x(vals.length-1)} ${y(0)} L${x(0)} ${y(0)}Z" fill="url(#ag)"/><path class="ln" pathLength="1" d="${d}" fill="none" stroke="#FFD21F" stroke-width="2.4" stroke-linecap="round"/>
   <circle cx="${lx}" cy="${ly}" r="5" fill="#05080A" stroke="#FFD21F" stroke-width="2.4"/><text x="${lx}" y="${ly-14}" text-anchor="end" style="fill:#F3F0E8;font-weight:650">${vals[vals.length-1]}</text>${xl}</svg>`}
function donut(parts){
  const tot=parts.reduce((a,p)=>a+p.v,0)||1,r=62,c=2*Math.PI*r;let off=0;
  return `<svg width="168" height="168" viewBox="0 0 168 168" role="img" aria-label="Доли по видам спорта"><circle cx="84" cy="84" r="${r}" fill="none" stroke="#1e2220" stroke-width="20"/>${parts.map(p=>{const len=p.v/tot*c,s=`<circle cx="84" cy="84" r="${r}" fill="none" stroke="${p.c}" stroke-width="20" stroke-dasharray="${Math.max(0,len-3)} ${c}" stroke-dashoffset="${-off}" transform="rotate(-90 84 84)"/>`;off+=len;return s}).join('')}</svg>`}
function drawCharts(){document.querySelectorAll('[data-chart]').forEach(el=>{const w=Math.floor(el.clientWidth);if(w<200)return;const was=el.dataset.w;if(was==w)return;el.dataset.w=w;el.innerHTML=areaChart(w,JSON.parse(el.dataset.l),JSON.parse(el.dataset.v));requestAnimationFrame(()=>el.firstChild&&el.firstChild.classList.add('go'))})}

/* ---------- организатор ---------- */
function vDash(){
  const ps=D.parents,act=ps.filter(active).length,pend=ps.filter(p=>p.pend),soon=ps.filter(p=>active(p)&&p.until-Date.now()<7*DAY);
  const cnt={};ps.forEach(p=>cnt[p.sport]=(cnt[p.sport]||0)+1);
  const top=Object.entries(cnt).sort((a,b)=>b[1]-a[1]),cols=['#FFD21F','#3FD98A','#46C6D8','#E07A45'];
  const parts=top.slice(0,4).map(([s,v],i)=>({s,v,c:cols[i]}));const rest=top.slice(4).reduce((a,[,v])=>a+v,0);if(rest)parts.push({s:'Остальные виды',v:rest,c:'#4a5a54'});
  const first=ps.filter(p=>p.d.length).length,withEv=ps.filter(p=>p.reg.length).length;
  const fun=[['Зарегистрировались',ps.length],['Посмотрели урок',first],['Получили сертификат',ps.filter(p=>p.certAt).length],['Оформили подписку',act],['Записались на событие',withEv]];
  const labels=['Май','Июн','Июл','Авг','Сен','Окт'],vals=[2,3,5,6,8,act];
  return `${head('Back-office','Кабинет организатора','<button class="btn ghost sm" data-go="aevents">Расписание</button><button class="btn sm" data-go="users">Подписчики</button>')}
  <div class="grid g4" style="gap:14px">
  <div class="card kpi"><div class="row1"><span class="eyebrow">Родителей в системе</span>${ic('users')}</div><p class="v">${ps.length}</p><p class="d">из ${new Set(ps.map(p=>p.city)).size} городов</p></div>
  <div class="card kpi"><div class="row1"><span class="eyebrow">Активные подписки</span>${ic('shield')}</div><p class="v">${act}</p><p class="d">${soon.length} истекают за 7 дней</p></div>
  <div class="card kpi"><div class="row1"><span class="eyebrow">Выручка за 30 дней</span>${ic('wallet')}</div><p class="v">${money(D.rev)}<small>BYN</small></p><p class="d">по подтверждённым оплатам</p></div>
  <div class="card kpi ${pend.length?'warn':''}"><div class="row1"><span class="eyebrow">Ждут подтверждения</span>${ic('clock')}</div><p class="v">${pend.length}</p><p class="d">${pend.length?'откройте «Подписчики»':'всё обработано'}</p></div></div>
  <div class="grid g-main mt"><div class="card"><p class="eyebrow">Активные подписки по месяцам</p><h3 style="font-size:1.25rem;margin-bottom:8px">Динамика подписчиков</h3><div data-chart data-l='${JSON.stringify(labels)}' data-v='${JSON.stringify(vals)}' style="min-height:290px"></div></div>
  <div class="card"><p class="eyebrow">Состав</p><h3 style="font-size:1.25rem">Виды спорта</h3><div class="donut">${donut(parts)}<div class="c"><b>${ps.length}</b><span>родителей</span></div></div>
   <div class="leg">${parts.map(p=>`<div><i style="background:${p.c}"></i><span>${esc(p.s)}</span><b>${p.v}</b></div>`).join('')}</div></div></div>
  <div class="grid g-main mt"><div class="card"><p class="eyebrow">Воронка</p><h3 style="font-size:1.25rem">От регистрации до события</h3><div class="fun">${fun.map(([l,v],i)=>`<div><div class="l"><span>${l}</span><b>${v} <span class="muted" style="font-weight:500">· ${Math.round(v/ps.length*100)}%</span></b></div><div class="bar"><i style="width:${v/ps.length*100}%;background:${['#4a5a54','#46C6D8','#E07A45','#FFD21F','#3FD98A'][i]}"></i></div></div>`).join('')}</div></div>
  <div class="card"><p class="eyebrow">Требует внимания</p><h3 style="font-size:1.25rem;margin-bottom:4px">Оплаты и сроки</h3>
   ${pend.map(p=>`<div class="row"><div class="t"><p><b>${esc(p.n)}</b></p><p class="small muted">${PLANS.find(x=>x.id===p.pend).t}</p></div><button class="btn sm" data-confirm="${p.id}">Подтвердить</button></div>`).join('')}
   ${soon.map(p=>`<div class="row"><div class="t"><p><b>${esc(p.n)}</b></p><p class="small muted">истекает ${fd(p.until)}</p></div><span class="pill wait">Скоро</span></div>`).join('')}
   ${pend.length+soon.length?'':'<p class="muted small" style="margin-top:10px">Всё спокойно.</p>'}</div></div>`}
function vUsers(){
  const F={all:['Все',()=>true],act:['Активные',active],pend:['Ждут оплату',p=>p.pend],none:['Без подписки',p=>!active(p)&&!p.pend]};
  const list=D.parents.filter(F[S.uf][1]);
  return `${head('Back-office','Подписчики')}<div class="chips" role="group" aria-label="Фильтр">${Object.entries(F).map(([k,[t]])=>`<button class="chip" aria-pressed="${S.uf===k}" data-uf="${k}">${t} · ${D.parents.filter(F[k][1]).length}</button>`).join('')}</div>
  <div class="card mt"><div class="scroll"><table><thead><tr><th>Имя</th><th>Спорт</th><th>Город</th><th>Подписка</th><th></th></tr></thead><tbody>
  ${list.map(p=>`<tr><td><b>${esc(p.n)}</b></td><td>${esc(p.sport)}</td><td>${esc(p.city)}</td><td>${statusPill(p)}</td><td>${p.pend?`<button class="btn sm" data-confirm="${p.id}">Подтвердить оплату</button>`:''}</td></tr>`).join('')||'<tr><td colspan="5" class="muted">Никого нет.</td></tr>'}</tbody></table></div></div>`}
function vClubs(){
  const cs=D.clubs,codes=cs.reduce((a,c)=>a+c.codes,0),used=cs.reduce((a,c)=>a+c.used,0),certs=cs.reduce((a,c)=>a+c.certs,0);
  return `${head('Back-office','Клубы и коды')}<div class="grid g3" style="gap:14px">
  <div class="card kpi"><div class="row1"><span class="eyebrow">Клубов-партнёров</span>${ic('shield')}</div><p class="v">${cs.length}</p><p class="d">${[...new Set(cs.map(c=>c.city))].join(', ')}</p></div>
  <div class="card kpi"><div class="row1"><span class="eyebrow">Кодов активировано</span>${ic('card')}</div><p class="v">${used}<small>из ${codes}</small></p><p class="d">${Math.round(used/codes*100)}% семей начали</p></div>
  <div class="card kpi"><div class="row1"><span class="eyebrow">Сертификатов по клубам</span>${ic('check')}</div><p class="v">${certs}</p><p class="d">${Math.round(certs/used*100)}% от активировавших</p></div></div>
  <div class="grid g-main mt"><div class="card"><div class="scroll"><table><thead><tr><th>Клуб</th><th>Код</th><th>Активировано</th><th>Сертификаты</th></tr></thead><tbody>
  ${cs.map(c=>`<tr><td><b>${esc(c.n)}</b><p class="small muted">${esc(c.city)} · ${esc(c.sport)}</p></td><td><span class="pill wait">${esc(c.code)}</span></td><td style="min-width:150px"><p class="small"><b>${c.used}</b> из ${c.codes}</p><div class="prog" style="margin-top:6px"><i style="width:${c.used/c.codes*100}%"></i></div></td><td>${c.certs}</td></tr>`).join('')}</tbody></table></div></div>
  <div class="card"><form id="club-form"><p class="eyebrow">Новый пакет</p><h3 style="margin-bottom:12px">Выпустить коды для клуба</h3>
   <div class="f"><label for="cl-n">Клуб</label><input type="text" id="cl-n" placeholder="Например: ДЮСШ «Олимп»"></div>
   <div class="f"><label for="cl-c">Город</label><input type="text" id="cl-c" placeholder="Минск"></div>
   <div class="f"><label for="cl-k">Сколько семей</label><select id="cl-k"><option>20</option><option>40</option><option>60</option><option>100</option></select></div>
   <p class="small muted" style="margin-bottom:12px">Счёт клубу: 12 BYN за семью (пример).</p>
   <button class="btn" type="submit">Выпустить коды</button></form></div></div>`}
function vAEvents(){
  const ev=D.events.slice().sort((a,b)=>a.at-b.at);
  return `${head('Back-office','Расписание')}<div class="grid g-main"><div class="card"><p class="eyebrow">События</p>
  ${ev.map(e=>`<div class="row">${evDate(e)}<div class="t"><p><b>${esc(e.t)}</b></p><p class="small muted">${e.type} · ${hm(e.at)} · ${e.sport==='all'?'все виды':esc(e.sport)} · записалось ${D.parents.filter(p=>p.reg.includes(e.id)).length}</p></div><button class="btn ghost sm" data-del="${e.id}">Удалить</button></div>`).join('')}</div>
  <div class="card"><form id="ev-form"><p class="eyebrow">Новое событие</p>
   <div class="f"><label for="ev-t">Название</label><input type="text" id="ev-t" placeholder="Например: Как выбрать секцию"></div>
   <div class="f"><label for="ev-k">Тип</label><select id="ev-k"><option>Вебинар</option><option>Семинар</option></select></div>
   <div class="f"><label for="ev-s">Вид спорта</label><select id="ev-s"><option value="all">Для всех</option>${SPORTS.map(s=>`<option>${esc(s)}</option>`).join('')}</select></div>
   <div class="f"><label for="ev-d">Дата и время</label><input type="datetime-local" id="ev-d"></div>
   <button class="btn" type="submit">Добавить</button></form></div></div>`}
function vContent(){
  return `${head('Back-office','Материалы')}<p class="muted" style="margin:-10px 0 18px">Родители видят только утверждённые курсы. Статус меняет методист.</p>
  <div class="card"><div class="scroll"><table><thead><tr><th>Курс</th><th>Спорт</th><th>Уроков</th><th>Источники</th><th>Эксперт</th><th>Статус</th></tr></thead><tbody>
  ${COURSES.map(c=>`<tr><td><b>${esc(c.t)}</b></td><td>${c.sport==='all'?'все':esc(c.sport)}</td><td>${c.lessons.length}</td><td class="small muted" style="max-width:220px">${esc(c.basis)}</td><td><span class="pill wait">Ждёт проверки</span></td><td style="min-width:190px"><label class="sr" for="st${c.id}">Статус</label><select id="st${c.id}" data-st="${c.id}">${STATUS.map((s,i)=>`<option value="${i}" ${D.status[c.id]===i?'selected':''}>${s}</option>`).join('')}</select></td></tr>`).join('')}</tbody></table></div></div>`}

const VIEWS={landing:vLanding,login:vLogin,plans:vPlans,pay:vPay,home:vHome,courses:vCourses,course:vCourse,lesson:vLesson,events:vEvents,profile:vProfile,dash:vDash,users:vUsers,clubs:vClubs,aevents:vAEvents,content:vContent};
function render(){
  const body=VIEWS[S.view]();
  if(S.role)$('#app').innerHTML=shell(body);
  else{const k=body.indexOf('<!--/story-->'),pre=k<0?'':body.slice(0,k),post=k<0?body:body.slice(k+13);$('#app').innerHTML=pubTop()+pre+`<main class="pub">${DEMO}${post}</main>`}
  drawCharts();hud();
  if(window.T3&&$('#stage'))T3.mount($('#stage'));
}
function hud(){const st=$('#story');if(!st)return;const r=st.getBoundingClientRect(),p=Math.min(1,Math.max(0,-r.top/(st.offsetHeight-innerHeight))),n=Math.min(4,Math.round(p*4));
  const b=$('#hud-bar');if(b)b.style.transform=`scaleX(${p.toFixed(3)})`;const t=$('#hud-n');if(t)t.innerHTML=`<b>0${n+1}</b> / 05`;
  document.querySelectorAll('.step').forEach((e,i)=>e.classList.toggle('on',i===n))}
addEventListener('scroll',hud,{passive:true});
let rt;addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(drawCharts,150)});

/* ---------- события ---------- */
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-go],[data-act],[data-lesson],[data-course],[data-ans],[data-sport],[data-plan],[data-pay],[data-reg],[data-unreg],[data-confirm],[data-del],[data-toast],[data-scroll],[data-uf],[data-rem],[data-famdel]');if(!t)return;
  const d=t.dataset;
  if(d.scroll){const el=$(d.scroll);if(el)el.scrollIntoView({behavior:'smooth',block:'start'});return}
  if(d.go){go(d.go);return}
  if(d.uf){S.uf=d.uf;render();return}
  if(d.rem){const m=me(),id=+d.rem;m.rem=m.rem.includes(id)?m.rem.filter(x=>x!==id):[...m.rem,id];toast(m.rem.includes(id)?'Напомним за день: email и Telegram (демо)':'Напоминание выключено');render();return}
  if(d.famdel){me().fam.splice(+d.famdel,1);render();return}
  if(d.sport){const y=window.scrollY;S.sport=d.sport;render();window.scrollTo({top:y,behavior:'instant'});return}
  if(d.course){go('course',{course:+d.course});return}
  if(d.lesson){go('lesson',{lesson:+d.lesson});return}
  if(d.toast){toast(d.toast);return}
  if(d.ans){
    const [id,j]=d.ans.split(':').map(Number),l=lesson(id);S.quiz[id]=j;
    if(j===l.r&&!me().d.includes(id)){const m=me();m.d.push(id);if(!m.certAt&&certified(m)){m.certAt=Date.now();toast('Курс пройден — вы получили сертификат '+certNo(m))}else toast('Урок пройден')}
    const y=window.scrollY;render();window.scrollTo({top:y,behavior:'instant'});return}
  if(d.plan){S.plan=d.plan;if(!S.role)S.role='parent';go('pay');return}
  if(d.pay){me().pend=d.pay;toast('Оплата отправлена на проверку');go('profile');return}
  if(d.reg){me().reg.push(+d.reg);toast('Вы записаны');render();return}
  if(d.unreg){me().reg=me().reg.filter(x=>x!==+d.unreg);render();return}
  if(d.confirm){
    const p=D.parents.find(x=>x.id===d.confirm),pl=PLANS.find(x=>x.id===p.pend),days={m1:30,m3:91,y1:365}[p.pend]||30;
    D.rev+=pl?pl.price:0;p.until=Math.max(p.until||0,Date.now())+days*DAY;p.pend=null;toast('Подписка продлена');render();return}
  if(d.del){D.events=D.events.filter(x=>x.id!==+d.del);D.parents.forEach(p=>p.reg=p.reg.filter(x=>x!==+d.del));render();return}
  const a=d.act;
  if(a==='enter-parent'){S.role='parent';go('home')}
  if(a==='enter-new'){const m=me();m.until=null;m.pend=null;m.club=null;S.role='parent';go('home')}
  if(a==='enter-admin'){S.role='admin';go('dash')}
  if(a==='out'){S.role=null;go('landing')}
  if(a==='reset'){D=seed();S.quiz={};S.certQ='';toast('Данные сброшены');render()}
});
document.addEventListener('submit',e=>{
  e.preventDefault();
  if(e.target.id==='cert-form'){S.certQ=$('#cert-n').value;const y=window.scrollY;render();window.scrollTo({top:y,behavior:'instant'});return}
  if(e.target.id==='code-form'){const v=$('#club-code').value.trim().toUpperCase(),c=D.clubs.find(x=>x.code===v);if(!c){toast('Код не найден. Для проверки: LED-2026');return}const m=me();m.until=null;m.pend=null;m.club=c.id;c.used++;S.role='parent';toast('Код клуба «'+c.n+'» активирован');go('home');return}
  if(e.target.id==='fam-form'){const v=$('#fam-n').value.trim();if(!v){toast('Введите имя');return}me().fam.push(v);toast('Приглашение отправлено (демо)');render();return}
  if(e.target.id==='club-form'){const n=$('#cl-n').value.trim(),c=$('#cl-c').value.trim();if(!n||!c){toast('Укажите клуб и город');return}const k=+$('#cl-k').value,code=(n.replace(/[^А-ЯA-Zа-яa-zЁё]/g,'').slice(0,4).toUpperCase()||'CLUB')+'-'+(100+D.clubs.length);D.clubs.push({id:'c'+(D.clubs.length+1),n,city:c,sport:'разные',code,codes:k,used:0,certs:0});D.rev+=k*12;toast('Выпущено '+k+' кодов: '+code);render();return}
  if(e.target.id==='prof-form'){const m=me();m.n=$('#pf-n').value.trim()||m.n;m.sport=$('#pf-s').value;m.city=$('#pf-c').value.trim()||m.city;toast('Сохранено');render()}
  if(e.target.id==='ev-form'){
    const t=$('#ev-t').value.trim(),dv=$('#ev-d').value;if(!t||!dv){toast('Укажите название и дату');return}
    D.events.push({id:D.nextE++,type:$('#ev-k').value,t,sport:$('#ev-s').value,at:new Date(dv).getTime(),link:'ссылка появится перед началом',rec:false});
    toast('Событие добавлено');render()}
});
document.addEventListener('change',e=>{const s=e.target.closest('[data-st]');if(s){D.status[+s.dataset.st]=+s.value;toast('Статус обновлён')}});
render();

</script>
</body></html>
