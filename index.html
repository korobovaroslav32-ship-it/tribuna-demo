/* Мир: протокол и табло соревнований. Ночное табло с сегментными цифрами, бумажные протоколы, билеты-афиши, зелёное поле для тарифов. Белорусские красный и зелёный как тихий акцент. */
:root{
  --night:#0D1814; --night-2:#16271F; --field:#1B7A4B; --field-deep:#0E4A2D;
  --paper:#EEF0E8; --paper-2:#DFE4D6; --ink:#0F1B16; --muted:#4A5C52;
  --amber:#FFB400; --red:#D4272E; --on-night:#EAF1EC; --dim:#8FA79A;
  --display:'Oswald Variable','Oswald','Arial Narrow',Impact,sans-serif;
  --font:'Onest Variable','Onest',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --r:4px; --hard:4px 4px 0 var(--ink);
  --step-0:clamp(.95rem,.9rem + .2vw,1.05rem); --step-1:clamp(1.15rem,1rem + .6vw,1.4rem);
  --step-2:clamp(1.6rem,1.2rem + 1.6vw,2.4rem); --step-3:clamp(2.2rem,1.4rem + 3.2vw,4rem);
  --step-4:clamp(3rem,1rem + 9vw,8.6rem);
  --gut:clamp(16px,4vw,48px);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;color-scheme:light}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased}
::selection{background:var(--amber);color:var(--ink)}
h1,h2,h3,h4,p,ul{margin:0}
h1,h2,h3{font-family:var(--display);font-weight:600;text-transform:uppercase;letter-spacing:.01em;line-height:1.05;text-wrap:balance}
h2{font-size:var(--step-3)} h3{font-size:var(--step-1);letter-spacing:.02em}
p{text-wrap:pretty}
button,input,select{font:inherit}
a{color:inherit}
:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
.sr{position:absolute;left:-9999px}
.lbl{font-size:.74rem;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.dark .lbl{color:var(--dim)}
.mono{font-variant-numeric:tabular-nums}
.small{font-size:.86rem}.muted{color:var(--muted)}
/* кнопки */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:10px 20px;border:2px solid var(--ink);background:var(--amber);color:var(--ink);border-radius:var(--r);font-weight:700;cursor:pointer;box-shadow:var(--hard);transition:transform .12s,box-shadow .12s;text-decoration:none}
.btn:hover{transform:translate(-1px,-1px);box-shadow:5px 5px 0 var(--ink)}
.btn:active{transform:translate(3px,3px) scale(.98);box-shadow:1px 1px 0 var(--ink)}
.btn.line{background:transparent;color:var(--ink);box-shadow:none}
.btn.line:hover{background:var(--ink);color:var(--paper);transform:none;box-shadow:none}
.btn.sm{min-height:44px;padding:6px 14px;font-size:.88rem}
.dark .btn{border-color:var(--amber);box-shadow:4px 4px 0 var(--amber)}
.dark .btn:hover{box-shadow:5px 5px 0 var(--amber)}
.dark .btn.line{color:var(--on-night);border-color:var(--on-night);box-shadow:none}
.dark .btn.line:hover{background:var(--on-night);color:var(--night)}
.btn:disabled{opacity:.45;cursor:default}
/* шапка */
.top{position:sticky;top:0;z-index:20;background:var(--night);color:var(--on-night);border-bottom:3px solid var(--amber)}

  <div class="panel" style="margin-top:18px">${c.lessons.map((l,i)=>{const free=i===0,can=sub||free,did=m.d.includes(l.id);
   return `<div class="row"><div class="t"><h3>${i+1}. ${esc(l.t)}</h3><p class="small muted">${l.min} мин${free&&!sub?' · бесплатный урок':''}</p></div>
   <div>${did?'<span class="pill ok">Пройден</span> ':''}${can?`<button class="btn ${did?'line':''} sm" data-lesson="${l.id}">${did?'Повторить':'Открыть'}</button>`:'<span class="pill wait">По подписке</span>'}</div></div>`}).join('')}</div>
  ${sub?'':lockBox()}</section>`}

function vLesson(){
  const l=lesson(S.lesson);if(!l)return vCourses();const c=COURSES.find(x=>x.id===l.c),i=c.lessons.indexOf(l);
  if(!(active(me())||i===0))return `<section class="area wrap"><button class="btn line sm" data-course="${c.id}">← К курсу</button>${lockBox()}</section>`;
  const picked=S.quiz[l.id],did=me().d.includes(l.id);
  return `<section class="area wrap"><button class="btn line sm" data-course="${c.id}">← ${esc(c.t)}</button>
  <div class="panel" style="margin-top:16px"><p class="lbl">Урок ${i+1} · ${l.min} мин</p><h2 style="font-size:var(--step-2);margin-block:6px 0">${esc(l.t)}</h2>
  <div class="video"><div><svg viewBox="0 0 64 64" fill="currentColor" aria-hidden="true"><path d="M20 12l36 20-36 20z"/></svg><b>Видеоурок</b><p class="small" style="opacity:.7">Место для видео. Файл хранится на сервере в Беларуси.</p></div></div>
  <p style="max-width:62ch">${esc(l.text)}</p><p class="small muted" style="margin-top:10px">Материалы к уроку: памятка для родителей (PDF) — пример.</p>
  ${l.q?`<h3 style="margin-block:24px 10px">${esc(l.q)}</h3>${l.o.map((o,j)=>`<button class="opt ${picked===j?(j===l.r?'right':'wrong'):''}" data-ans="${l.id}:${j}">${esc(o)}${picked===j?(j===l.r?' — верно':' — попробуйте ещё раз'):''}</button>`).join('')}`:''}
  ${did?'<p class="pill ok" style="margin-top:8px">Урок пройден</p>':''}</div></section>`}

function vEvents(){
  const m=me(),sub=active(m),now=Date.now();
  const up=D.events.filter(e=>e.at>=now).sort((a,b)=>a.at-b.at),past=D.events.filter(e=>e.at<now).sort((a,b)=>b.at-a.at);
  const card=e=>{const reg=m.reg.includes(e.id),d=new Date(e.at);return `<div class="ticket"><div class="stub"><b class="mono">${d.getDate()}</b><span>${MON3[d.getMonth()]}</span></div><div class="body"><p class="lbl">${e.type} · ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}</p><h3>${esc(e.t)}</h3><p class="small muted">${e.sport==='all'?'Для всех видов спорта':esc(e.sport)}</p>${reg&&sub&&e.link?`<p class="small"><b>${esc(e.link)}</b></p>`:''}
   <div class="act">${!sub?'<span class="pill wait">По подписке</span>':reg?`<span class="pill ok">Вы записаны</span> <button class="btn line sm" data-unreg="${e.id}">Отменить</button>`:`<button class="btn sm" data-reg="${e.id}">Записаться</button>`}</div></div></div>`};
  return `<section class="area wrap"><h2>Семинары и вебинары</h2>${sub?'':'<div class="lock"><div><p>Расписание открыто всем, запись и записи вебинаров — по подписке.</p></div><button class="btn line" data-go="plans" style="border-color:var(--ink)">Выбрать подписку</button></div>'}
  <h3 style="margin-block:28px 14px">Предстоящие</h3><div class="tickets">${up.map(card).join('')||'<p class="muted">Пока ничего не запланировано.</p>'}</div>
  <div class="panel" style="margin-top:28px"><h3>Записи</h3>${past.map(e=>`<div class="row"><div class="t"><p><b>${esc(e.t)}</b></p><p class="small muted">${e.type} · ${fd(e.at)}</p></div>${e.rec?(sub?'<button class="btn sm" data-toast="Здесь откроется запись">Смотреть запись</button>':'<span class="pill wait">По подписке</span>'):'<span class="pill draft">Записи нет</span>'}</div>`).join('')||'<p class="muted small">Пока пусто.</p>'}</div></section>`}

function vProfile(){
  const m=me(),hist=m.d.map(lesson).filter(Boolean);
  return `<section class="area wrap"><h2>Кабинет и подписка</h2><div class="grid2">
  <div class="panel"><h3>Подписка</h3><p style="margin-block:8px 10px">${statusPill(m)}</p>
   ${active(m)?`<p class="small muted">Осталось ${Math.ceil((m.until-Date.now())/DAY)} дн.</p><button class="btn line sm" style="margin-top:10px" data-go="plans">Продлить</button>`:m.pend?'<p class="small muted">Организатор проверит оплату и откроет доступ.</p>':'<button class="btn" data-go="plans">Оформить подписку</button>'}
   <h3 style="margin-top:26px">История обучения</h3>
   ${hist.length?hist.map(l=>`<div class="row"><div class="t"><p>${esc(l.t)}</p><p class="small muted">${esc(COURSES.find(c=>c.id===l.c).t)}</p></div><span class="pill ok">Пройден</span></div>`).join(''):'<p class="muted small">Пока нет пройденных уроков.</p>'}
   <h3 style="margin-top:26px">Мои записи</h3>
   ${m.reg.length?m.reg.map(id=>D.events.find(e=>e.id===id)).filter(Boolean).map(e=>`<div class="row"><div class="t"><p>${esc(e.t)}</p><p class="small muted">${ft(e.at)}</p></div></div>`).join(''):'<p class="muted small">Вы ни на что не записаны.</p>'}</div>
  <div class="panel"><form id="prof-form"><h3>Профиль</h3>
   <div class="field-f"><label for="pf-n">Имя</label><input type="text" id="pf-n" value="${esc(m.n)}"></div>
   <div class="field-f"><label for="pf-s">Вид спорта ребёнка</label><select id="pf-s">${SPORTS.map(s=>`<option ${s===m.sport?'selected':''}>${esc(s)}</option>`).join('')}</select></div>
   <div class="field-f"><label for="pf-c">Город</label><input type="text" id="pf-c" value="${esc(m.city)}"></div>
   <button class="btn" type="submit">Сохранить</button></form>
   <p class="small muted" style="margin-top:16px">Данных о детях платформа не хранит.</p>
   <button class="btn line sm" data-act="reset" style="margin-top:10px">Сбросить данные макета</button></div></div></section>`}

/* ---------- организатор ---------- */
function vDash(){
  const ps=D.parents,act=ps.filter(active).length,pend=ps.filter(p=>p.pend).length,soon=ps.filter(p=>active(p)&&p.until-Date.now()<7*DAY).length;
  const bySport=SPORTS.map(s=>({s,n:ps.filter(p=>p.sport===s).length,a:ps.filter(p=>p.sport===s&&active(p)).length})).filter(r=>r.n);
  return `<section class="area wrap"><h2>Обзор</h2><div class="stats">
  <div class="stat">${digits(ps.length)}<p class="cap">родителей в системе</p></div><div class="stat">${digits(act)}<p class="cap">с активной подпиской</p></div>
  <div class="stat ${pend?'warn':''}">${digits(pend)}<p class="cap">оплат ждут подтверждения</p></div><div class="stat ${soon?'warn':''}">${digits(soon)}<p class="cap">истекают за 7 дней</p></div></div>
  <div class="panel"><h3>По видам спорта</h3><div class="scroll"><table><thead><tr><th>Вид спорта</th><th>Родителей</th><th>С подпиской</th></tr></thead><tbody>${bySport.map(r=>`<tr><td>${esc(r.s)}</td><td class="mono">${r.n}</td><td class="mono">${r.a}</td></tr>`).join('')}</tbody></table></div></div></section>`}
function vUsers(){
  return `<section class="area wrap"><h2>Подписчики</h2><div class="panel" style="margin-top:18px"><div class="scroll"><table><thead><tr><th>Имя</th><th>Спорт</th><th>Город</th><th>Подписка</th><th></th></tr></thead><tbody>
  ${D.parents.map(p=>`<tr><td>${esc(p.n)}</td><td>${esc(p.sport)}</td><td>${esc(p.city)}</td><td>${statusPill(p)}</td><td>${p.pend?`<button class="btn sm" data-confirm="${p.id}">Подтвердить оплату</button>`:''}</td></tr>`).join('')}</tbody></table></div></div></section>`}
function vAEvents(){
  const ev=D.events.slice().sort((a,b)=>a.at-b.at);
  return `<section class="area wrap"><h2>Расписание</h2><div class="grid2"><div class="panel"><h3>События</h3>
  ${ev.map(e=>`<div class="row"><div class="t"><p><b>${esc(e.t)}</b></p><p class="small muted">${e.type} · ${ft(e.at)} · ${e.sport==='all'?'все виды':esc(e.sport)} · записалось ${D.parents.filter(p=>p.reg.includes(e.id)).length}</p></div><button class="btn line sm" data-del="${e.id}">Удалить</button></div>`).join('')}</div>
  <div class="panel"><form id="ev-form"><h3>Новое событие</h3>
   <div class="field-f"><label for="ev-t">Название</label><input type="text" id="ev-t" placeholder="Например: Как выбрать секцию"></div>
   <div class="field-f"><label for="ev-k">Тип</label><select id="ev-k"><option>Вебинар</option><option>Семинар</option></select></div>
   <div class="field-f"><label for="ev-s">Вид спорта</label><select id="ev-s"><option value="all">Для всех</option>${SPORTS.map(s=>`<option>${esc(s)}</option>`).join('')}</select></div>
   <div class="field-f"><label for="ev-d">Дата и время</label><input type="datetime-local" id="ev-d"></div>
   <button class="btn" type="submit">Добавить</button></form></div></div></section>`}
function vContent(){
  return `<section class="area wrap"><h2>Материалы</h2><p class="muted" style="margin-bottom:18px">Родители видят только утверждённые курсы. Статус меняет методист.</p>
  <div class="panel"><div class="scroll"><table><thead><tr><th>Курс</th><th>Спорт</th><th>Уроков</th><th>Статус</th></tr></thead><tbody>
  ${COURSES.map(c=>`<tr><td>${esc(c.t)}</td><td>${c.sport==='all'?'все':esc(c.sport)}</td><td class="mono">${c.lessons.length}</td><td><label class="sr" for="st${c.id}">Статус</label><select id="st${c.id}" data-st="${c.id}">${STATUS.map((s,i)=>`<option value="${i}" ${D.status[c.id]===i?'selected':''}>${s}</option>`).join('')}</select></td></tr>`).join('')}</tbody></table></div></div></section>`}

const VIEWS={landing:vLanding,login:vLogin,plans:vPlans,pay:vPay,home:vHome,courses:vCourses,course:vCourse,lesson:vLesson,events:vEvents,profile:vProfile,dash:vDash,users:vUsers,aevents:vAEvents,content:vContent};
function render(){renderTop();$('#app').innerHTML=VIEWS[S.view]()}

/* ---------- события ---------- */
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-go],[data-act],[data-lesson],[data-course],[data-ans],[data-sport],[data-plan],[data-pay],[data-reg],[data-unreg],[data-confirm],[data-del],[data-toast],[data-scroll]');if(!t)return;
  const d=t.dataset;
  if(d.scroll){const el=$(d.scroll);if(el)el.scrollIntoView({behavior:'smooth',block:'start'});return}
  if(d.go){go(d.go);return}
  if(d.sport){const y=window.scrollY;S.sport=d.sport;render();window.scrollTo({top:y,behavior:'instant'});return}
  if(d.course){go('course',{course:+d.course});return}
  if(d.lesson){go('lesson',{lesson:+d.lesson});return}
  if(d.toast){toast(d.toast);return}
  if(d.ans){
    const [id,j]=d.ans.split(':').map(Number),l=lesson(id);S.quiz[id]=j;
    if(j===l.r&&!me().d.includes(id)){me().d.push(id);toast('Урок пройден')}
    const y=window.scrollY;render();window.scrollTo({top:y,behavior:'instant'});return}
  if(d.plan){S.plan=d.plan;if(!S.role)S.role='parent';go('pay');return}
  if(d.pay){me().pend=d.pay;toast('Оплата отправлена на проверку');go('profile');return}
  if(d.reg){me().reg.push(+d.reg);toast('Вы записаны');render();return}
  if(d.unreg){me().reg=me().reg.filter(x=>x!==+d.unreg);render();return}
  if(d.confirm){
    const p=D.parents.find(x=>x.id===d.confirm),days={m1:30,m3:91,y1:365}[p.pend]||30;
    p.until=Math.max(p.until||0,Date.now())+days*DAY;p.pend=null;toast('Подписка продлена');render();return}
  if(d.del){D.events=D.events.filter(x=>x.id!==+d.del);D.parents.forEach(p=>p.reg=p.reg.filter(x=>x!==+d.del));render();return}
  const a=d.act;
  if(a==='enter-parent'){S.role='parent';go('home')}
  if(a==='enter-new'){const m=me();m.until=null;m.pend=null;S.role='parent';go('home')}
  if(a==='enter-admin'){S.role='admin';go('dash')}
  if(a==='out'){S.role=null;go('landing')}
  if(a==='reset'){D=seed();S.quiz={};toast('Данные сброшены');render()}
});
document.addEventListener('submit',e=>{
  e.preventDefault();
  if(e.target.id==='prof-form'){const m=me();m.n=$('#pf-n').value.trim()||m.n;m.sport=$('#pf-s').value;m.city=$('#pf-c').value.trim()||m.city;toast('Сохранено');render()}
  if(e.target.id==='ev-form'){
    const t=$('#ev-t').value.trim(),dv=$('#ev-d').value;if(!t||!dv){toast('Укажите название и дату');return}
    D.events.push({id:D.nextE++,type:$('#ev-k').value,t,sport:$('#ev-s').value,at:new Date(dv).getTime(),link:'ссылка появится перед началом',rec:false});
    toast('Событие добавлено');render()}
});
document.addEventListener('change',e=>{const s=e.target.closest('[data-st]');if(s){D.status[+s.dataset.st]=+s.value;toast('Статус обновлён')}});
render();
</script>
